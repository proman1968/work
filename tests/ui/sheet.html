<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Sheet UI tests</title></head>
<body>
<script type="module">
/**
 * Ведомость в настоящем браузере (tests/ui/run.mjs): строки текстом, отступ субсчетов,
 * параметры уходят в fetch, ошибка видна, клик по счёту открывает его форму.
 */
import '/oda/oda.js';
import sheetProto from '/REGISTER/$register/$folder/$class/$register/handlers/pages/form/sheet/$handler/sheet.js';

const results = [];
window.__results = results;
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
        try {
            if (await fn()) return true;
        }
        catch { /* ещё нет */ }
        await tick(20);
    }
    return false;
};
async function test(name, fn) {
    try {
        await fn();
        results.push({ name, ok: true });
    }
    catch (e) {
        results.push({ name, ok: false, error: String(e?.stack || e) });
    }
}
function assert(v, msg) {
    if (!v)
        throw new Error(msg || 'assert');
}
function eq(a, b, msg) {
    if (a !== b)
        throw new Error((msg || 'eq') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
async function mount(tag, props = {}) {
    await customElements.whenDefined(tag);
    const el = document.createElement(tag);
    Object.assign(el, props);
    document.body.appendChild(el);
    await tick(80);
    return el;
}
const text = el => el?.textContent?.trim();

/** Копия прототипа с сохранением геттеров/сеттеров (spread их убивает). */
function cloneProto(src, is) {
    const proto = {};
    for (const k of [...Object.getOwnPropertyNames(src), ...Object.getOwnPropertySymbols(src)])
        Object.defineProperty(proto, k, Object.getOwnPropertyDescriptor(src, k));
    proto.is = is;
    proto.imports = undefined;
    return proto;
}

await ODA(cloneProto(sheetProto, 'test-sheet'));

const RES = {
    from: '2026-02-01', to: '2026-02-28',
    rows: [
        { path: '/REGISTER/62', label: 'Расчёты', level: 0, leaf: false, open_debit: 1000, open_credit: 0, debit: 400, credit: 600, close_debit: 800, close_credit: 0 },
        { path: '/REGISTER/62/01', label: 'Покупатели', level: 1, leaf: true, open_debit: 1000, open_credit: 0, debit: 0, credit: 600, close_debit: 400, close_credit: 0 },
        { path: '/REGISTER/90', label: 'Продажи', level: 0, leaf: true, open_debit: 0, open_credit: 1000, debit: 0, credit: 400, close_debit: 0, close_credit: 1400 },
    ],
    total: { open_debit: 1000, open_credit: 1000, debit: 400, credit: 1000, close_debit: 800, close_credit: 1400 },
};
function stubItem(calls, res) {
    return {
        fetch: async (method, params) => {
            calls.push({ method, params });
            if (method === 'sheet')
                return res;
            return null;
        },
    };
}
const dataRows = (el) => [...el.__shadowRoot__.querySelectorAll('div.grid div.row:not(.head):not(.total)')];

await test('sheet: шапка, строки текстом, отступ субсчёта, итог', async () => {
    const calls = [];
    const el = await mount('test-sheet', { $item: stubItem(calls, RES) });
    assert(await until(() => dataRows(el).length === 3), 'три строки');
    const head = [...el.__shadowRoot__.querySelectorAll('div.grid div.head div.cell')].map(text).join('|');
    eq(head, 'Счёт|Нач. Дт|Нач. Кт|Оборот Дт|Оборот Кт|Кон. Дт|Кон. Кт');
    const r = dataRows(el);
    assert(r[0].textContent.includes('Расчёты') && r[0].textContent.includes('800'), 'родитель: ' + r[0].textContent);
    assert(r[1].textContent.includes('Покупатели') && r[1].textContent.includes('400'), 'субсчёт: ' + r[1].textContent);
    const pad = el => parseInt(el.querySelector('div.cell.acc').style.paddingLeft || '0');
    eq(pad(r[0]), 0, 'отступ родителя');
    eq(pad(r[1]), 16, 'отступ субсчёта');
    assert(!el.__shadowRoot__.textContent.includes('[object Object]'), 'без [object Object]');
    const total = el.__shadowRoot__.querySelector('div.row.total').textContent;
    assert(total.includes('1400') && total.includes('Итого'), 'итог: ' + total);
    el.remove();
});

await test('sheet: параметры уходят в fetch, ошибка видна', async () => {
    const calls = [];
    const el = await mount('test-sheet', { $item: stubItem(calls, RES) });
    assert(await until(() => dataRows(el).length === 3), 'строки');
    el.from = '2026-02-01';
    el.to = '2026-02-28';
    el.account = '/REGISTER/62';
    await el.reload();
    const sent = calls.at(-1);
    eq(sent.method, 'sheet');
    eq(sent.params.from, '2026-02-01');
    eq(sent.params.to, '2026-02-28');
    eq(sent.params.account, '/REGISTER/62');
    el.remove();
    const bad = await mount('test-sheet', { $item: { fetch: async () => { throw new Error('сервер отказал'); } } });
    assert(await until(() => text(bad.__shadowRoot__.querySelector('.error')).includes('сервер отказал')), 'ошибка показана');
    bad.remove();
});

await test('sheet: клик по счёту открывает его форму', async () => {
    const el = await mount('test-sheet', { $item: stubItem([], RES) });
    assert(await until(() => dataRows(el).length === 3), 'строки');
    const got = [], opened = [];
    const prevWork = window.WORK, prevExec = window.execute;
    window.WORK = { get_item: async (p) => { got.push(p); return { path: p }; } };
    window.execute = (t) => opened.push(t.path);
    try {
        dataRows(el)[1].querySelector('div.cell.acc').click();
        await tick(80);
        eq(got.join(','), '/REGISTER/62/01');
        eq(opened.join(','), '/REGISTER/62/01');
    }
    finally {
        window.WORK = prevWork;
        window.execute = prevExec;
    }
    el.remove();
});

window.__done = true;
</script>
</body>
</html>
