<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Journal UI tests</title></head>
<body>
<script type="module">
/**
 * Журнал проводок (db_journal) в настоящем браузере (tests/ui/run.mjs):
 * проводки текстом с названиями из names, фильтры уходят в fetch, ошибка видна,
 * клик открывает форму счёта/класса операции.
 */
import '/oda/oda.js';
import journalProto from '/DATA/REGISTER/$register/$folder/$class/$register/handlers/pages/form/journal/$handler/journal.js';

const results = [];
window.__results = results;
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
        try {
            if (await fn()) return true;
        }
        catch { /* ещё нет */ }
        await tick(20);
    }
    return false;
};
async function test(name, fn) {
    try {
        await fn();
        results.push({ name, ok: true });
    }
    catch (e) {
        results.push({ name, ok: false, error: String(e?.stack || e) });
    }
}
function assert(v, msg) {
    if (!v)
        throw new Error(msg || 'assert');
}
function eq(a, b, msg) {
    if (a !== b)
        throw new Error((msg || 'eq') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
async function mount(tag, props = {}) {
    await customElements.whenDefined(tag);
    const el = document.createElement(tag);
    Object.assign(el, props);
    document.body.appendChild(el);
    await tick(80);
    return el;
}
const text = el => el?.textContent?.trim();

/** Копия прототипа с сохранением геттеров/сеттеров (spread их убивает). */
function cloneProto(src, is) {
    const proto = {};
    for (const k of [...Object.getOwnPropertyNames(src), ...Object.getOwnPropertySymbols(src)])
        Object.defineProperty(proto, k, Object.getOwnPropertyDescriptor(src, k));
    proto.is = is;
    proto.imports = undefined;
    return proto;
}

await ODA(cloneProto(journalProto, 'test-journal'));

const rub = v => Number(v).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Ответ db_journal учётного ядра: проводки, итог, названия объектов и классов, пути классов
const RES = {
    total: 2,
    sum: { amount: 1500, qty: 0 },
    items: [
        { time: 1788000000000, op_id: 'o2', op_cid: '/DATA/OPERATIONS/SALE', debit: '/DATA/REGISTER/62', credit: '/DATA/REGISTER/90',
            amount: 500, debit_analytics: { counterparty: 'c1' }, credit_analytics: {}, storno: true },
        { time: 1787900000000, op_id: 'o1', op_cid: '/DATA/OPERATIONS/SALE', debit: '/DATA/REGISTER/62', credit: '/DATA/REGISTER/90',
            amount: 1000, debit_analytics: { counterparty: 'c1' }, credit_analytics: {}, storno: false },
    ],
    names: {
        objects: { o1: 'Счёт 1', o2: 'Счёт 2', c1: 'Альфа' },
        classes: { '/DATA/REGISTER/62': 'Расчёты', '/DATA/REGISTER/90': 'Продажи', '/DATA/OPERATIONS/SALE': 'Продажа' },
        paths: { '/DATA/REGISTER/62': '/DATA/REGISTER/62', '/DATA/REGISTER/90': '/DATA/REGISTER/90', '/DATA/OPERATIONS/SALE': '/DATA/OPERATIONS/SALE' },
    },
};
function stubItem(calls, res) {
    return {
        fetch: async (method, params) => {
            calls.push({ method, params });
            if (method === 'db_journal')
                return res;
            return null;
        },
    };
}
const dataRows = (el) => [...el.__shadowRoot__.querySelectorAll('div.grid div.row:not(.head):not(.total)')];

await test('journal: шапка и строки текстом, сторно помечено', async () => {
    const calls = [];
    const el = await mount('test-journal', { $item: stubItem(calls, RES) });
    assert(await until(() => dataRows(el).length === 2), 'две строки');
    const head = [...el.__shadowRoot__.querySelectorAll('div.grid div.head div.cell')].map(text).join('|');
    eq(head, 'Дата|Операция|Дебет|Аналитика Дт|Кредит|Аналитика Кт|Сумма|Кол-во|Статус');
    const first = dataRows(el)[0].textContent;
    assert(first.includes('Счёт 2'), 'операция: ' + first);
    assert(first.includes('62 Расчёты'), 'дебет: ' + first);
    assert(first.includes('Альфа'), 'аналитика: ' + first);
    assert(first.includes('90 Продажи'), 'кредит: ' + first);
    assert(first.includes(rub(500)), 'сумма: ' + first);
    assert(first.includes('сторно'), 'статус: ' + first);
    assert(dataRows(el)[0].classList.contains('storno'), 'строка сторно выделена');
    assert(!el.__shadowRoot__.textContent.includes('[object Object]'), 'без [object Object]');
    assert(el.__shadowRoot__.querySelector('div.row.total').textContent.includes(rub(1500)), 'итог');
    el.remove();
});

await test('journal: фильтры уходят в db_journal, ошибка видна', async () => {
    const calls = [];
    const el = await mount('test-journal', { $item: stubItem(calls, RES) });
    assert(await until(() => dataRows(el).length === 2), 'строки');
    eq(calls[0].params.desc, true, 'новые сверху');
    el.from = '2026-01-01';
    el.account = '/DATA/REGISTER/62';
    el.opClass = '/DATA/OPERATIONS/SALE';
    el.$('input[type=checkbox]').click();
    assert(await until(() => el.effective === true), 'галка «только действующие»');
    await el.reload();
    const sent = calls.at(-1);
    eq(sent.method, 'db_journal');
    eq(sent.params.from, '2026-01-01');
    eq(sent.params.account, '/DATA/REGISTER/62');
    eq(sent.params.op_cid, '/DATA/OPERATIONS/SALE');
    eq(sent.params.effective, true);
    el.remove();
    const bad = await mount('test-journal', { $item: { fetch: async () => { throw new Error('сервер отказал'); } } });
    assert(await until(() => text(bad.__shadowRoot__.querySelector('.error')).includes('сервер отказал')), 'ошибка показана');
    bad.remove();
});

await test('journal: клик открывает форму счёта/класса операции', async () => {
    const calls = [];
    const el = await mount('test-journal', { $item: stubItem(calls, RES) });
    assert(await until(() => dataRows(el).length === 2), 'строки');
    const got = [], opened = [];
    const prevWork = window.WORK, prevExec = window.execute;
    window.WORK = { get_item: async (p) => { got.push(p); return { path: p }; } };
    window.execute = (t) => opened.push(t.path || t);
    try {
        const cells = dataRows(el)[0].querySelectorAll('div.cell.link');
        eq(cells.length, 3);
        cells[0].click();
        await tick(80);
        eq(got.join(','), '/DATA/OPERATIONS/SALE');
        eq(opened.join(','), '/DATA/OPERATIONS/SALE');
        cells[1].click();
        await tick(80);
        eq(got.at(-1), '/DATA/REGISTER/62');
        cells[2].click();
        await tick(80);
        eq(got.at(-1), '/DATA/REGISTER/90');
    }
    finally {
        window.WORK = prevWork;
        window.execute = prevExec;
    }
    el.remove();
});

window.__done = true;
</script>
</body>
</html>
