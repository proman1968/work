const results = [];
window.__results = results;
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
        try {
            if (await fn()) return true;
        }
        catch { /* ещё нет */ }
        await tick(20);
    }
    return false;
};
async function test(name, fn) {
    try {
        await fn();
        results.push({ name, ok: true });
    }
    catch (e) {
        results.push({ name, ok: false, error: String(e?.stack || e) });
    }
}
function assert(v, msg) {
    if (!v)
        throw new Error(msg || 'assert');
}
function eq(a, b, msg) {
    if (a !== b)
        throw new Error((msg || 'eq') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
async function mount(tag, props = {}) {
    await customElements.whenDefined(tag);
    const el = document.createElement(tag);
    Object.assign(el, props);
    document.body.appendChild(el);
    await tick(80);
    return el;
}
const text = el => el?.textContent?.trim();
const allText = el => el?.textContent || '';
const shadowOf = el => el?.__shadowRoot__ || el?.shadowRoot || null;
/** Все элементы по селектору, включая вложенные shadow DOM (oda-table). */
function deepAll(root, selector) {
    const out = [];
    const walk = (node) => {
        for (const el of node.querySelectorAll('*')) {
            if (el.matches?.(selector))
                out.push(el);
            const sr = shadowOf(el);
            if (sr)
                walk(sr);
        }
    };
    const sr = shadowOf(root);
    if (sr)
        walk(sr);
    return out;
}
/** Текст с учётом shadow DOM: свой текст + текст всех теневых корней. */
function deepText(root) {
    let out = root?.textContent || '';
    const sr = shadowOf(root);
    if (sr)
        out += deepText(sr);
    for (const el of root?.querySelectorAll?.('*') || []) {
        const esr = shadowOf(el);
        if (esr)
            out += deepText(esr);
    }
    return out;
}
// В стенде WORK.showModal — базовый ODA.showModal, поэтому тег oda-popover.
const popovers = () => [...document.querySelectorAll('oda-popover')];
const lastPopover = () => popovers().at(-1);
const modalOf = pop => pop?.querySelector('item-object-editor');
const modalButtons = modal => deepAll(modal, 'oda-button').map(b => b.textContent.trim());
const promptOf = pop => popovers().find(p => p !== pop && deepText(p).includes('Сохранить перед закрытием?'));
const popTitle = pop => pop?.__shadowRoot__?.querySelector('.title label')?.textContent?.trim();
async function waitPopover() {
    let pop = null;
    assert(await until(() => !!(pop = lastPopover())), 'окно не открылось');
    return pop;
}

/** Копия прототипа с сохранением геттеров/сеттеров (spread их убивает). */
function cloneProto(src, is) {
    const proto = {};
    for (const k of [...Object.getOwnPropertyNames(src), ...Object.getOwnPropertySymbols(src)])
        Object.defineProperty(proto, k, Object.getOwnPropertyDescriptor(src, k));
    proto.is = is;
    proto.imports = undefined;
    return proto;
}

const FIELDS = [
    { id: 'name', label: 'Название' },
    { id: 'client', label: 'Клиент', type: 'Link', catalog: '/DATA/CATALOGS/C' },
];
const _day = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
// Журнал точки: сегодня и ещё два дня назад (по убыванию)
const today = () => _day(new Date());
const LOG_DAYS = [today(), _day(new Date(Date.now() - 13 * 864e5)), _day(new Date(Date.now() - 44 * 864e5))];
function mockItem(calls, handlers, fields) {
    return {
        body: Promise.resolve({ label: 'Операции', METADATA: { FIELDS: fields || FIELDS } }),
        // logs({mode:'dates'}) — дни журнала по убыванию, сегодня первым (как logs.datesList):
        // из них form/objects берёт границы полосы периодов
        logs: async () => LOG_DAYS,
        fetch: async (method, params, post) => {
            calls.push({ method, params, post });
            return handlers[method] ? handlers[method](params, post) : null;
        },
    };
}

    const calls = [];

    });
    const el = await mount('test-objects', { $item });
    const headers = () => deepAll(el, '.hcell .title').map(text);
    const rows = () => deepAll(el, 'oda-table-row');
    const html = () => 'headers=' + JSON.stringify(headers()) + ' rows=' + rows().length;
    const cellText = (cell) => {
        const t = deepText(cell).trim();
        const v = deepAll(cell, 'input').map(i => i.value).join('');
        return t || v;
    };
    assert(await until(() => headers().length === 2), 'шапка: ' + html());
    eq(headers().join('|'), 'Название|Клиент');
    assert(await until(() => rows().length === 2), 'строки: ' + html());
    const cells = rows().flatMap(row => deepAll(row, 'oda-table-cell').map(cellText));
    eq(cells.join('|'), 'Продажа|Альфа|Оплата|');
    assert(!deepText(el).includes('[object Object]'), 'нет [object Object]');
    el.remove();
});

await test('objects: полоса периодов сверху, выборка идёт по пакету', async () => {
    const calls = [];

        index: () => ({ rows: [{ id: '1.X', name: 'Продажа' }] }),

    eq(el.packetsEnd, LOG_DAYS[0], 'верхняя граница — первый день журнала');
    eq(el.packetsStart, LOG_DAYS[2], 'нижняя граница — самый старый день');
    assert(await until(() => calls.some(c => c.method === 'index')), 'строки загрузились по событию пакета');
    eq(calls.filter(c => c.method === 'index').length, 1,
        'одна выборка: авто-событие пропа selection не должно дублировать её');
    eq(el.packetsKey, 'now', 'дефолт «Сегодня» не затирается пустым ключом пакета');
    eq(el.$('oda-packets').mask, today() + '*', 'в пакете выбран сегодняшний день');
    eq(calls.find(c => c.method === 'index').params.from, today() + 'T00:00:00', 'левая граница выборки');
    eq(calls.find(c => c.method === 'index').params.to, today() + 'T00:00:00', 'правая граница выборки');
    assert(el.rows.length, 'строки пришли: ' + JSON.stringify(el.rows));
    el.remove();
});

await test('objects: Удалить спрашивает подтверждение', async () => {
    const calls = [];
    const $item = mockItem(calls, {
        index: () => ({ rows: [{ id: '1.X', name: 'Старая', client: '' }] }),
        read_object: () => ({ body: { name: 'Старая', client: '' } }),
        delete_object: () => null,
    });
    const el = await mount('test-objects', { $item });
    assert(await until(() => deepAll(el, 'oda-table-row').length === 1), 'строка');
    const opening = el.openEditor({ id: '1.X' });
    const pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок: ' + popTitle(pop));
    await tick(60);
    const btn = deepAll(modalOf(pop), 'oda-button').find(b => b.textContent.trim() === 'Удалить');
    assert(btn, 'кнопка Удалить');

    const confirmOf = () => popovers().find(p => p !== pop && deepText(p).includes('Удалить объект?'));
    btn.click();
    let confirm = null;
    assert(await until(() => !!(confirm = confirmOf())), 'подтверждение');
    confirm.close();
    assert(await until(() => !confirm.isConnected), 'подтверждение закрыто');
    assert(pop.isConnected, 'Отмена оставила окно');
    assert(!calls.some(c => c.method === 'delete_object'), 'Отмена не удаляет');

    btn.click();
    confirm = null;
    assert(await until(() => !!(confirm = confirmOf())), 'подтверждение 2');
    confirm.ok();
    assert(await until(() => !pop.isConnected), 'окно закрыто после удаления');
    await opening;
    assert(calls.some(c => c.method === 'delete_object'), 'delete_object вызван');
    el.remove();
});

await test('objects: закрытие с изменениями — Да/Нет/Отмена', async () => {
    const calls = [];
    const $item = mockItem(calls, {
        index: () => ({ rows: [{ id: '1.X', name: 'Старая', client: '' }] }),
        read_object: () => ({ body: { name: 'Старая', client: '', posted: { entry: 'e' }, deleted: false } }),
        update_object: () => ({}),
    });
    const el = await mount('test-objects', { $item });
    assert(await until(() => deepAll(el, 'oda-table-row').length === 1), 'строка');

    let opening = el.openEditor({ id: '1.X' });
    let pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок: ' + popTitle(pop));
    await tick(60); // форма и начальный снимок уже отрисованы
    el.editing = { ...el.editing, name: 'Новая' };
    assert(el.isDirty(), 'есть изменения');

    // Отмена — не сохранять и не закрывать
    pop.close();
    let prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт');
    prompt.close();
    assert(await until(() => !prompt.isConnected), 'промпт закрыт');
    assert(pop.isConnected, 'Отмена оставила окно');
    eq(el.editing?.name, 'Новая', 'изменения остались в форме');

    // Нет — не сохранять и закрыть
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 2');
    prompt.ok(2);
    await opening;
    assert(!pop.isConnected, 'Нет закрыла окно');
    eq(el.editing, null, 'editing очищен');
    assert(!calls.some(c => c.method === 'update_object'), 'Нет не сохраняет');

    // Да — сохранить и закрыть
    opening = el.openEditor({ id: '1.X' });
    pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок 2');
    await tick(60);
    el.editing = { ...el.editing, name: 'Новая' };
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 3');
    prompt.ok(1);
    await opening;
    const sent = calls.find(c => c.method === 'update_object');
    assert(sent, 'Да сохранила');
    eq(JSON.stringify(sent.post), JSON.stringify({ name: 'Новая', client: '' }));
    assert(!pop.isConnected, 'Да закрыла окно');

    // Ошибка сохранения видна в окне, закрытие не происходит
    opening = el.openEditor({ id: '1.X' });
    pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок 3');
    await tick(60);
    el.editing = { ...el.editing, name: 'Плохая' };
    const fetch = $item.fetch;
    $item.fetch = async (method, params, post) => {
        if (method === 'update_object')
            throw new Error('сервер отказал: нет обязательного поля');
        return fetch(method, params, post);
    };
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 4');
    prompt.ok(1);
    assert(await until(() => deepAll(modalOf(pop), '.error').some(e => e.textContent.includes('сервер отказал'))),
        'ошибка в окне: ' + deepText(modalOf(pop)));
    assert(pop.isConnected, 'ошибка не закрыла окно');
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 5');
    prompt.ok(2);
    await opening;
    assert(!pop.isConnected, 'окно закрыто после ошибки');
    el.remove();
});

await test('postings: ячейки аналитик — текст, итоги и сальдо', async () => {
    const calls = [];
    const $item = {
        body: Promise.resolve({ METADATA: { FIELDS: [
            { id: 'counterparty', label: 'Контрагент', type: 'Link', catalog: '/DATA/CATALOGS/C', analytic: true },
        ] } }),
        fetch: async (method, params, post) => {
            calls.push({ method, params, post });
            if (method === 'query')
                return [
                    { body: { time: 100, debit: 1000, credit: 0, counterparty: '9.Y', corr_account: '/DATA/REGISTER/90' } },
                    { body: { time: 200, debit: 0, credit: 700, counterparty: '9.Y', corr_account: '/DATA/REGISTER/51' } },
                ];
            if (method === 'read_link')
                return { id: '9.Y', name: 'Альфа' };
            return null;
        },
    };
    const el = await mount('test-postings', { $item });
    const rows = () => [...el.__shadowRoot__.querySelectorAll('div.grid div.row:not(.head):not(.total)')];
    const html = () => 'rows=' + rows().length;
    assert(await until(() => rows().length === 2), 'две проводки: ' + html());
    assert(!allText(el).includes('[object Object]'), 'нет [object Object]');
    const first = rows()[0].textContent;
    assert(first.includes('Альфа'), 'имя аналитики: ' + first);
    assert(el.$('.row.total').textContent.includes('300'), 'сальдо 300: ' + el.$('.row.total').textContent);
    const q = calls.find(c => c.method === 'query');
    assert(q && typeof q.params.where === 'string' || !q.params.where, 'where — строка или пуст');
    el.remove();
});

await test('postings: остаток на начало и нарастающий', async () => {
    const calls = [];
    const $item = {
        body: Promise.resolve({ METADATA: {
            FIELDS: [
                { id: 'counterparty', label: 'Контрагент', type: 'Link', catalog: '/DATA/CATALOGS/C', analytic: true },
            ],
            INDEXES: [{ id: 'turnover', kind: 'turnover', by: ['counterparty'] }],
        } }),
        fetch: async (method, params, post) => {
            calls.push({ method, params, post });
            if (method === 'query')
                return [
                    { body: { time: 100, debit: 1000, credit: 0, counterparty: '9.Y', corr_account: '/DATA/REGISTER/90' } },
                    { body: { time: 200, debit: 0, credit: 700, counterparty: '9.Y', corr_account: '/DATA/REGISTER/51' } },
                ];
            if (method === 'index')
                return { def: 'turnover', kind: 'turnover', total: { debit: 200, credit: 0 } };
            if (method === 'read_link')
                return { id: '9.Y', name: 'Альфа' };
            return null;
        },
    };
    const el = await mount('test-postings', { $item });
    const rows = () => [...el.__shadowRoot__.querySelectorAll('div.grid div.row:not(.head):not(.total)')];
    assert(await until(() => rows().length === 2), 'две проводки');
    eq(el.hasOpening, false, 'без периода остатка нет');
    el.from = '2026-02-01';
    await el.reload();
    assert(await until(() => el.hasOpening === true), 'остаток загружен');
    const ix = calls.find(c => c.method === 'index');
    assert(ix && ix.params.id === 'turnover', 'индекс оборотов');
    assert(/^\d{4}-\d{2}-\d{2}$/.test(ix.params.to) && ix.params.to < '2026-02-01', 'день до from: ' + ix.params.to);
    const bar = () => [...el.__shadowRoot__.querySelectorAll('div.bar')].map(text).join('|');
    assert(await until(() => bar().includes('200')), 'начало 200: ' + bar());
    const cells = rows().map(r => r.textContent);
    assert(cells[0].includes('1200'), 'нарастающий 1200: ' + cells[0]);
    assert(cells[1].includes('500'), 'нарастающий 500: ' + cells[1]);
    assert(el.__shadowRoot__.querySelector('div.row.total').textContent.includes('500'), 'конец 500');
    el.remove();
});
