const results = [];
window.__results = results;
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
        try {
            if (await fn()) return true;
        }
        catch { /* ещё нет */ }
        await tick(20);
    }
    return false;
};
async function test(name, fn) {
    try {
        await fn();
        results.push({ name, ok: true });
    }
    catch (e) {
        results.push({ name, ok: false, error: String(e?.stack || e) });
    }
}
function assert(v, msg) {
    if (!v)
        throw new Error(msg || 'assert');
}
function eq(a, b, msg) {
    if (a !== b)
        throw new Error((msg || 'eq') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
async function mount(tag, props = {}) {
    await customElements.whenDefined(tag);
    const el = document.createElement(tag);
    Object.assign(el, props);
    document.body.appendChild(el);
    await tick(80);
    return el;
}
const text = el => el?.textContent?.trim();
const allText = el => el?.textContent || '';
const shadowOf = el => el?.__shadowRoot__ || el?.shadowRoot || null;
/** Все элементы по селектору, включая вложенные shadow DOM (oda-table). */
function deepAll(root, selector) {
    const out = [];
    const walk = (node) => {
        for (const el of node.querySelectorAll('*')) {
            if (el.matches?.(selector))
                out.push(el);
            const sr = shadowOf(el);
            if (sr)
                walk(sr);
        }
    };
    const sr = shadowOf(root);
    if (sr)
        walk(sr);
    return out;
}
/** Текст с учётом shadow DOM: свой текст + текст всех теневых корней. */
function deepText(root) {
    let out = root?.textContent || '';
    const sr = shadowOf(root);
    if (sr)
        out += deepText(sr);
    for (const el of root?.querySelectorAll?.('*') || []) {
        const esr = shadowOf(el);
        if (esr)
            out += deepText(esr);
    }
    return out;
}
// В стенде WORK.showModal — базовый ODA.showModal, поэтому тег oda-popover.

const modalOf = pop => pop?.querySelector('item-object-editor');
const modalButtons = modal => deepAll(modal, 'oda-button').map(b => b.textContent.trim());
const promptOf = pop => popovers().find(p => p !== pop && deepText(p).includes('Сохранить перед закрытием?'));
const popTitle = pop => pop?.__shadowRoot__?.querySelector('.title label')?.textContent?.trim();
async function waitPopover() {
    let pop = null;
    assert(await until(() => !!(pop = lastPopover())), 'окно не открылось');
    return pop;
}

/** Копия прототипа с сохранением геттеров/сеттеров (spread их убивает). */
function cloneProto(src, is) {
    const proto = {};
    for (const k of [...Object.getOwnPropertyNames(src), ...Object.getOwnPropertySymbols(src)])
        Object.defineProperty(proto, k, Object.getOwnPropertyDescriptor(src, k));
    proto.is = is;
    proto.imports = undefined;
    return proto;
}

// Ответ db_schema учётного ядра: поля с нормализованными типами, семейство, лист
const SCHEMA = (family = 'catalog') => ({ schema: {
    label: 'Операции', family, type: family === 'operation' ? '$operation' : '$catalog', leaf: true,
    fields: [{ id: 'name', label: 'Название', type: 'string' }, { id: 'client', label: 'Клиент', type: 'link', target: '/DATA/CATALOGS/C' }],
    postings: family === 'operation' ? [{ id: 'main' }] : [],
}, errors: [] });
const _day = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => _day(new Date());
/** Объект ядра для db_query/db_read. */
const obj = (id, body, extra = {}) => ({ id, status: 'active', version: 1, time: Date.now(), body, ...extra });
function mockItem(calls, handlers, family = 'catalog') {
    return {
        fetch: async (method, params, post) => {
            calls.push({ method, params, post });
            if (handlers[method])
                return handlers[method](params, post);
            return method === 'db_schema' ? SCHEMA(family) : null;
        },
    };
}

    const calls = [];

    });
    const el = await mount('test-objects', { $item });
    const headers = () => deepAll(el, '.hcell .title').map(text);
    const rows = () => deepAll(el, 'oda-table-row');
    const html = () => 'headers=' + JSON.stringify(headers()) + ' rows=' + rows().length;
    const cellText = (cell) => {
        const t = deepText(cell).trim();
        const v = deepAll(cell, 'input').map(i => i.value).join('');
        return t || v;
    };
    assert(await until(() => headers().length === 2), 'шапка: ' + html());
    eq(headers().join('|'), 'Название|Клиент');

    assert(!el.$('oda-packets'), 'у справочника нет полосы периодов');
    el.remove();
});

await test('objects: кнопка Создать открывает окно с заголовком и кнопками', async () => {
    const calls = [];

    assert(!modalButtons(modal).includes('Провести'), 'у справочника нет Провести');

    assert(await until(() => !pop.isConnected), 'окно закрыто');

    eq(el.editing, null, 'editing очищен');

await test('objects: операция — окно с датой, проводками и действиями по статусу', async () => {
    const calls = [];
    let status = 'draft';
    const $item = mockItem(calls, {
        db_query: () => ({ items: [obj('1.X', { name: 'Продажа' }, { status })], names: {} }),
        db_read: () => obj('1.X', { name: 'Продажа' }, { status, time: new Date(2026, 9, 14, 12).getTime() }),
        db_preview: () => ({ entries: [{ debit: '/R/62', credit: '/R/90', amount: 10 }], errors: [] }),
        db_entries: () => [{ debit: '/R/62', credit: '/R/90', amount: 10 }],
        db_print_list: () => [{ name: 'invoice', label: 'Товарная накладная' }],
    }, 'operation');
    const el = await mount('test-objects', { $item });
    assert(await until(() => deepAll(el, 'oda-table-row').length === 1), 'строка');
    let opening = el.openEditor({ id: '1.X' });
    let pop = await waitPopover();
    let modal = modalOf(pop);
    assert(await until(() => modalButtons(modal).includes('Провести')), 'черновик: ' + modalButtons(modal).join('|'));
    assert(modalButtons(modal).includes('Удалить') && !modalButtons(modal).includes('Отменить'), 'черновик: удалить, без отмены');
    eq(el.editing.time, '2026-10-14', 'дата операции в форме');
    assert(await until(() => deepText(modal).includes('Дт 62 — Кт 90')), 'предпросмотр проводок: ' + deepText(modal));
    pop.close();
    await opening;

    status = 'registered';
    opening = el.openEditor({ id: '1.X' });
    pop = await waitPopover();
    modal = modalOf(pop);
    assert(await until(() => modalButtons(modal).includes('Отменить')), 'проведённая: ' + modalButtons(modal).join('|'));
    assert(!modalButtons(modal).includes('Удалить') && !modalButtons(modal).includes('Провести'), 'проведённая: без удаления и проведения');
    assert(calls.some(c => c.method === 'db_entries'), 'действующие проводки');
    assert(await until(() => modalButtons(modal).includes('Товарная накладная')), 'кнопка печатной формы: ' + modalButtons(modal).join('|'));
    pop.close();
    await opening;
    el.remove();
});

await test('objects: Удалить спрашивает подтверждение', async () => {

        db_query: () => ({ items: [obj('1.X', { name: 'Старая' })], names: {} }),

    await tick(60);
    const btn = deepAll(modalOf(pop), 'oda-button').find(b => b.textContent.trim() === 'Удалить');

await test('objects: закрытие с изменениями — Да/Нет/Отмена', async () => {
    const calls = [];
    const $item = mockItem(calls, {
        db_query: () => ({ items: [obj('1.X', { name: 'Старая' })], names: {} }),
        db_read: () => obj('1.X', { name: 'Старая' }),
        db_update: () => ({ id: '1.X', status: 'active', version: 2 }),
    });
    const el = await mount('test-objects', { $item });
    assert(await until(() => deepAll(el, 'oda-table-row').length === 1), 'строка');

    let opening = el.openEditor({ id: '1.X' });
    let pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок: ' + popTitle(pop));
    await tick(60); // форма и начальный снимок уже отрисованы
    el.editing = { ...el.editing, name: 'Новая' };
    assert(el.isDirty(), 'есть изменения');

    // Отмена — не сохранять и не закрывать
    pop.close();
    let prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт');
    prompt.close();
    assert(await until(() => !prompt.isConnected), 'промпт закрыт');
    assert(pop.isConnected, 'Отмена оставила окно');
    eq(el.editing?.name, 'Новая', 'изменения остались в форме');

    // Нет — не сохранять и закрыть
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 2');
    prompt.ok(2);
    await opening;
    assert(!pop.isConnected, 'Нет закрыла окно');
    eq(el.editing, null, 'editing очищен');
    assert(!calls.some(c => c.method === 'db_update'), 'Нет не сохраняет');

    // Да — сохранить и закрыть
    opening = el.openEditor({ id: '1.X' });
    pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок 2');
    await tick(60);
    el.editing = { ...el.editing, name: 'Новая', client: '' };
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 3');
    prompt.ok(1);
    await opening;
    const sent = calls.find(c => c.method === 'db_update');
    assert(sent, 'Да сохранила');
    eq(JSON.stringify(sent.post), JSON.stringify({ name: 'Новая', client: '' }));
    assert(!pop.isConnected, 'Да закрыла окно');

    // Ошибка сохранения видна в окне, закрытие не происходит
    opening = el.openEditor({ id: '1.X' });
    pop = await waitPopover();
    assert(await until(() => popTitle(pop) === 'Операции · Старая'), 'заголовок 3');
    await tick(60);
    el.editing = { ...el.editing, name: 'Плохая' };
    const fetch = $item.fetch;
    $item.fetch = async (method, params, post) => {
        if (method === 'db_update')
            throw new Error('сервер отказал: нет обязательного поля');
        return fetch(method, params, post);
    };
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 4');
    prompt.ok(1);
    assert(await until(() => deepAll(modalOf(pop), '.error').some(e => e.textContent.includes('сервер отказал'))),
        'ошибка в окне: ' + deepText(modalOf(pop)));
    assert(pop.isConnected, 'ошибка не закрыла окно');
    pop.close();
    prompt = null;
    assert(await until(() => !!(prompt = promptOf(pop))), 'промпт 5');
    prompt.ok(2);
    await opening;
    assert(!pop.isConnected, 'окно закрыто после ошибки');
    el.remove();
});

const rub = v => Number(v).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Ответы учётного ядра для карточки счёта: схема счёта (аналитика-ссылка) и db_card
const CARD_SCHEMA = { schema: { family: 'account', fields: [
    { id: 'counterparty', label: 'Контрагент', type: 'link', target: '/DATA/CATALOGS/C', analytic: true },
] }, errors: [] };
const CARD = {
    account: '/DATA/REGISTER/62', label: 'Расчёты',
    opening: { debit: 200, credit: 0 },
    turnover: { debit: 1000, credit: 700 },
    closing: { debit: 500, credit: 0 },
    total: 2,
    items: [
        { time: 100, op_id: 'o1', op_cid: '/DATA/OPERATIONS/SALE', debit: 1000, credit: 0, qty: 0,
            analytics: { counterparty: '9.Y' }, corr: '/DATA/REGISTER/90', balance: 1200 },
        { time: 200, op_id: 'o2', op_cid: '/DATA/OPERATIONS/PAY', debit: 0, credit: 700, qty: 0,
            analytics: { counterparty: '9.Y' }, corr: '/DATA/REGISTER/51', balance: 500 },
    ],
    names: { objects: { '9.Y': 'Альфа', o1: 'Продажа 1', o2: 'o2' },
        classes: { '/DATA/REGISTER/90': 'Продажи', '/DATA/OPERATIONS/PAY': 'Оплата' }, paths: {} },
};
function cardItem(calls) {
    return {
        fetch: async (method, params, post) => {
            calls.push({ method, params, post });
            if (method === 'db_schema')
                return CARD_SCHEMA;
            if (method === 'db_card')
                return CARD;
            return null;
        },
    };
}

await test('postings: ячейки аналитик и операций — текст, обороты и сальдо', async () => {

await test('postings: 4-шаговый интерфейс ODANT (Анализ счёта, двухпанельные Обороты и сборная Карточка проводки)', async () => {
    const calls = [];
    const item = {
        fetch: async (method, params) => {
            calls.push({ method, params });
            if (method === 'db_schema')
                return CARD_SCHEMA;
            if (method === 'db_card')
                return CARD;
            if (method === 'db_sheet') {
                return {
                    rows: [{ account: '/DATA/REGISTER/62', label: 'Расчёты', level: 1, leaf: true, key: { counterparty: '9.Y' },
                        opening: { debit: 200, credit: 0 }, turnover: { debit: 1000, credit: 700 }, closing: { debit: 500, credit: 0 },
                        qty: { opening: 1, debit: 5, credit: 3, closing: 3 } }],
                    total: { opening: { debit: 200, credit: 0 }, turnover: { debit: 1000, credit: 700 }, closing: { debit: 500, credit: 0 },
                        qty: { opening: 1, debit: 5, credit: 3, closing: 3 } },
                    names: CARD.names,
                };
            }
            if (method === 'db_turnovers') {
                return {
                    account: '/DATA/REGISTER/62', label: 'Расчёты', groupBy: 'quarter',
                    opening: { debit: 200, credit: 0, net: 200 },
                    groups: [{ key: '2026-Q1', label: '1 кв. 2026 г.', debit: 1000, credit: 700, turnover: 300, balance: 500, count: 2 }],
                    closing: { debit: 1000, credit: 700, turnover: 300, net: 500 },
                    total: 2,
                    items: [
                        { entry: 77, time: 100, groupKey: '2026-Q1', op_id: 'o1', op_cid: '/DATA/OPERATIONS/SALE', debit: 1000, credit: 0, corr: '/DATA/REGISTER/90', balance: 1200 },
                    ],
                    names: CARD.names,
                };
            }
            if (method === 'db_entry') {
                return {
                    entry: 77, time: 100, amount: 1000, qty: 0, storno: false,
                    operation: { id: 'o1', cid: '/DATA/OPERATIONS/SALE', title: 'Продажа 1' },
                    debit: { account: '/DATA/REGISTER/62', label: '62 Расчёты', amount: 1000, analytics: [{ id: 'counterparty', label: 'Контрагент', title: 'Альфа' }] },
                    credit: { account: '/DATA/REGISTER/90', label: '90 Продажи', amount: 1000, analytics: [] },
                };
            }
            return null;
        },
    };
    const el = await mount('test-postings', { $item: item });
    assert(await until(() => el.$('oda-packets')), 'полоса периодов oda-packets отрисована');

    // Экран 2: Анализ счёта
    await el.setMode('analysis');
    assert(await until(() => el.$('.analysis-layout') && deepText(el).includes('АНАЛИТИКИ СЧЁТА')),
        'Экран 2: Анализ счёта отрисован: ' + (el.__shadowRoot__?.innerHTML || '').slice(0, 600));
    assert(deepText(el).includes('Альфа') && deepText(el).includes(rub(500)), 'строка аналитики в Анализе счёта: ' + deepText(el));

    // Экран 3: Двухпанельные Обороты счёта
    await el.setMode('turnovers');
    assert(await until(() => el.$('.turnovers-layout') && deepText(el).includes('ГРУППИРОВАТЬ')), 'Экран 3: Обороты счёта отрисованы');
    assert(deepText(el).includes('1 кв. 2026 г.') && deepText(el).includes('со сч. 90 Продажи'), 'левая таблица периодов и правая таблица документов: ' + deepText(el));

    // Экран 4: Сборная карточка проводки
    await el.openEntry(77);
    assert(await until(() => el.$('.entry-card') && deepText(el).includes('Проводка #77')), 'Экран 4: Карточка проводки отрисована: ' + deepText(el));
    assert(deepText(el).includes('ДЕБЕТ:') && deepText(el).includes('КРЕДИТ:'), 'симметричные стороны Дебета и Кредита');
    el.remove();
});
