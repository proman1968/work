<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Link nodes UI tests</title></head>
<body>
<script type="module">
/**
 * Узлы-ссылки рабочего места (tests/ui/run.mjs) на настоящих реактивных элементах:
 * ссылка — отдельный экземпляр того же класса, запись в неё (isLink, items, expanded)
 * и Reactor.activate не проваливаются в настоящий класс.
 */
await import('/sources/client.js');
import { Reactor } from '/sources/reactor.js';
import { bindLinkTree, isLinkNode } from '/$server/$folder/lib/tree/link-nodes.js';
import nodeProto from '/$server/$folder/lib/node/node.js';

const results = [];
window.__results = results;
async function test(name, fn) {
    try {
        await fn();
        results.push({ name, ok: true });
    }
    catch (e) {
        results.push({ name, ok: false, error: String(e?.stack || e) });
    }
}
function assert(v, msg) {
    if (!v)
        throw new Error(msg || 'assert');
}
function eq(a, b, msg) {
    if (a !== b)
        throw new Error((msg || 'eq') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
const getterOf = (name) => Object.getOwnPropertyDescriptor(nodeProto, name).get;

/** Настоящий элемент как в приложении: WORK.__bind (свой реактивный контекст). */
function realItem(path, label, items) {
    return WORK.__bind({ path, id: path.split('/').pop(), type: '$class', label, icon: 'i-' + label, items });
}
const RAW = [
    { path: '/LNK/Платежи', label: 'Платежи', icon: 'i-pay', type: '$operation', access: 'read', children: [
        { path: '/LNK/Платежи/Поставщику', label: 'Поставщику', icon: 'i-sup', type: '$operation', access: 'write', children: [] },
    ] },
    { path: '/MISSING/Нет', label: 'Нет', icon: '', type: '', access: 'read', children: [] },
];
function fakeStore(prefix) {
    const pay = realItem(prefix + '/Платежи', 'Платежи', [{ path: prefix + '/Платежи/Настоящий', id: 'Настоящий', type: '$class', label: 'Настоящий' }]);
    const sup = realItem(prefix + '/Платежи/Поставщику', 'Поставщику');
    return { pay, sup, get: async (p) => {
        if (p === '/MISSING/Нет')
            return null;
        if (p === prefix + '/Платежи')
            return pay;
        if (p === prefix + '/Платежи/Поставщику')
            return sup;
        throw new Error('нет: ' + p);
    } };
}

await test('ссылка — отдельный экземпляр: запись не проваливается в класс', async () => {
    const s = fakeStore('/T1');
    const roots = await bindLinkTree(RAW.map(r => ({ ...r, path: r.path.replace('/LNK', '/T1'), children: r.children.map(c => ({ ...c, path: c.path.replace('/LNK', '/T1') })) })), s.get);
    const link = roots[0];
    assert(link !== s.pay, 'не сам класс');
    eq(Reactor.activate(link), link, 'активация стабильна');
    eq(isLinkNode(link), true);
    eq(isLinkNode(s.pay), false);
    assert(!('isLink' in s.pay), 'у класса нет isLink');
    assert(!('isLinkLeaf' in s.pay), 'у класса нет isLinkLeaf');
    // дети класса — свои, а не цепочка
    eq(s.pay[R].cache.items.map(i => i.path).join(','), '/T1/Платежи/Настоящий');
    eq(link.items.map(i => i.path).join(','), '/T1/Платежи/Поставщику');
    // раскрытие ссылки не трогает класс
    link.expanded = true;
    eq(link.expanded, true);
    eq(s.pay.expanded, false);
    // фокус на ссылке не подсвечивает класс
    const focusedItem = link;
    assert(focusedItem !== s.pay, 'фокус — ссылка');
    assert(!('isLink' in s.sup), 'лист класса чист');
});

await test('ссылка открывает форму класса: путь, подпись, fetch', async () => {
    const s = fakeStore('/T2');
    const roots = await bindLinkTree(RAW.map(r => ({ ...r, path: r.path.replace('/LNK', '/T2'), children: r.children.map(c => ({ ...c, path: c.path.replace('/LNK', '/T2') })) })), s.get);
    const link = roots[0].items[0];
    eq(link.path, '/T2/Платежи/Поставщику');
    eq(link.short, s.sup.short);
    eq(link.label, 'Поставщику');
    eq(link.icon, s.sup.icon);
    eq(typeof link.fetch, 'function');
    eq(typeof link.execute, 'function');
    eq(isLinkNode(link), true);
});

await test('ветки привязаны, дети — только цепочка', async () => {
    const s = fakeStore('/T3');
    const roots = await bindLinkTree(RAW.map(r => ({ ...r, path: r.path.replace('/LNK', '/T3'), children: r.children.map(c => ({ ...c, path: c.path.replace('/LNK', '/T3') })) })), s.get);
    eq(roots.length, 2);
    const ops = roots[0];
    eq(ops.isLinkLeaf, false);
    eq(ops.label, 'Платежи');
    eq(ops.items.length, 1);
    const leaf = ops.items[0];
    eq(leaf.path, '/T3/Платежи/Поставщику');
    eq(leaf.isLinkLeaf, true);
    eq(Array.isArray(leaf.items) && leaf.items.length, 0);
    assert(!JSON.stringify(ops).includes('Настоящий'), 'боковое скрыто');
});

await test('недоступный узел — узкий фолбэк с подписью сервера', async () => {
    const s = fakeStore('/T4');
    const roots = await bindLinkTree(RAW, s.get);
    const fb = roots[1];
    eq(fb.isLink, true);
    eq(fb.noLinkTarget, true);
    eq(fb.label, 'Нет');
    eq(fb.path, '/MISSING/Нет');
    assert(!(fb instanceof Function), 'plain-объект');
});

await test('повторная привязка — новый экземпляр без старого состояния', async () => {
    const s = fakeStore('/T5');
    const raw = RAW.map(r => ({ ...r, path: r.path.replace('/LNK', '/T5'), children: r.children.map(c => ({ ...c, path: c.path.replace('/LNK', '/T5') })) }));
    const first = (await bindLinkTree(raw, s.get))[0];
    first.expanded = true;
    const again = (await bindLinkTree(raw, s.get))[0];
    assert(again !== first, 'новый экземпляр');
    eq(again.expanded, false, 'раскрытие не унаследовано');
    eq(s.pay.expanded, false, 'класс не тронут');
});

await test('isLinkNode не дёргает _onEmpty настоящих элементов', async () => {
    const real = realItem('/T6/Класс', 'Класс');
    // любое чтение отсутствующего свойства у bound-элемента ушло бы в fetch/_onEmpty
    eq(isLinkNode(real), false);
    eq(isLinkNode(null), false);
    eq(isLinkNode({}), false);
});

await test('геттеры item-node: класс как раньше, ссылка узкая', async () => {
    const s = fakeStore('/T7');
    const raw = RAW.map(r => ({ ...r, path: r.path.replace('/LNK', '/T7'), children: r.children.map(c => ({ ...c, path: c.path.replace('/LNK', '/T7') })) }));
    const link = (await bindLinkTree(raw, s.get))[0].items[0];
    eq(isLinkNode(link), true);
    // Хост как компонент: геттеры прототипа (isLink, iconSize, …) видны через цепочку.
    const host = (over) => Object.assign(Object.create(nodeProto), { showStatus: false, showUsers: false }, over);
    const g = (name, h) => getterOf(name).call(h);
    eq(g('isLink', host({ $item: s.sup })), false);
    eq(g('isLink', host({ $item: link })), true);
    eq(g('iconSize', host({ $item: s.sup, showStatus: true })), 48);
    eq(g('iconSize', host({ $item: link, showStatus: true })), 24);
    assert(!Object.getOwnPropertyDescriptor(nodeProto, 'showBoss'), 'пользователей в строке дерева больше нет');
    assert(!nodeProto.template.includes('item-users'), 'шаблон без item-users');
    eq(g('status', host({ $item: link })), '');
    assert(!('isLink' in s.sup) && !('isLink' in s.pay), 'классы чистые');
});

await test('шаблон item-node без прямого чтения isLink', async () => {
    assert(!nodeProto.template.includes('$item?.isLink'), 'нет $item?.isLink');
    assert(!nodeProto.template.includes('$item.isLink'), 'нет $item.isLink');
    assert(nodeProto.template.includes('!isLink'), 'гейт isLink');
});

window.__done = true;
</script>
</body>
</html>
