<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Mail & Calendar & System UI tests</title></head>
<body>
<script type="module">
await import('/sources/client.js');
const calMod = await import('/$server/$folder/$class/$structure/handlers/pages/form/calendar/$handler/calendar.js');
const emailMod = await import('/$server/$folder/$class/$structure/handlers/pages/form/email/$handler/email.js');
const sysMod = await import('/$server/$folder/$class/$structure/handlers/pages/form/system/$handler/system.js');

function cloneProto(src, is) {
    const proto = {};
    for (const k of [...Object.getOwnPropertyNames(src), ...Object.getOwnPropertySymbols(src)])
        Object.defineProperty(proto, k, Object.getOwnPropertyDescriptor(src, k));
    proto.is = is;
    return proto;
}

await ODA(cloneProto(calMod.default, 'test-cal-view'));
await ODA(cloneProto(emailMod.default, 'test-email-view'));
await ODA(cloneProto(sysMod.default, 'test-sys-view'));

await ODA.waitReg('test-cal-view');
await ODA.waitReg('test-email-view');
await ODA.waitReg('test-sys-view');

const results = [];
window.__results = results;
async function test(name, fn) {
    try { await fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, error: String(e?.stack || e) }); }
}
const assert = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(fn, msg, ms = 3000) {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
        const v = fn();
        if (v) return v;
        await sleep(25);
    }
    throw new Error('не дождались: ' + (typeof msg === 'function' ? msg() : msg));
}

await test('Календарь: без правой панели, кнопки Встреча/Сегодня/слои/виды и сетка событий', async () => {
    const el = document.createElement('test-cal-view');
    el.style.cssText = 'display:flex;width:1000px;height:650px;';
    document.body.appendChild(el);
    const today = new Date();
    const pad = n => String(n).padStart(2, '0');
    const ds = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
    el.$item = {
        id: 'logistics', path: '/ORG/logistics', type: '$structure',
        listen() {}, unlisten() {},
        async fetch(m) {
            if (m === 'calendar_list') {
                return {
                    events: [
                        { kind: 'event', uid: 'e1', summary: 'Планёрка логистики', start: `${ds}T10:00:00`, end: `${ds}T11:00:00`, category: 'meeting', allDay: false },
                        { kind: 'task', uid: 't1', summary: 'Проверить маршрут', start: `${ds}T14:00:00`, end: `${ds}T14:30:00`, category: 'task', allDay: false },
                        { kind: 'schedule', uid: 's1', summary: 'Утренняя сводка ИИ', start: `${ds}T09:00:00`, end: `${ds}T09:30:00`, category: 'ai', allDay: false },
                    ],
                };
            }
            return {};
        },
    };
    const grid = await waitFor(() => el.$('oda-calendar-time-grid'), 'сетка времени');
    await waitFor(() => grid.$('.ev-card'), 'карточки событий в сетке');
    assert(!el.$('[slot="right-panel"]'), 'правой боковой панели Встречи больше нет');
    assert(el.$('.btn-new')?.textContent.includes('Встреча'), 'есть кнопка + Встреча');
    el.viewMode = 'month';
    const month = await waitFor(() => el.$('oda-calendar-month-view'), 'вид Месяц');
    await waitFor(() => month.$('.chip'), 'события в режиме Месяц');
    el.remove();
});

await test('Почта: 4 папки, светлое левое меню, без top-panel, единый список и чтение письма', async () => {
    const el = document.createElement('test-email-view');
    el.style.cssText = 'display:flex;width:1000px;height:650px;';
    document.body.appendChild(el);
    let readCalled = false;
    el.$item = {
        id: 'logistics', path: '/ORG/logistics', type: '$structure',
        listen() {}, unlisten() {},
        async fetch(m) {
            if (m === 'mail_accounts')
                return { accounts: [{ address: 'log@org.ru', label: 'log@org.ru', hasImap: true, hasSmtp: true }], canConfigure: true, autoRefresh: true };
            if (m === 'mail_list')
                return {
                    messages: [{
                        path: '/ORG/logistics/inbox.eml',
                        uid: 'm1',
                        subject: 'Запрос отгрузки',
                        from: 'client@test.ru',
                        to: 'log@org.ru',
                        date: new Date().toISOString(),
                        box: 'inbox',
                        read: false,
                        attachmentsCount: 1,
                        snippet: 'Просим подтвердить отгрузку',
                    }],
                    countsByBox: { inbox: 1, drafts: 2, outbox: 0, trash: 0 },
                    unreadByBox: { inbox: 1, drafts: 0, outbox: 0, trash: 0 },
                };
            if (m === 'mail_read') {
                readCalled = true;
                return {
                    path: '/ORG/logistics/inbox.eml',
                    uid: 'm1',
                    subject: 'Запрос отгрузки',
                    from: 'client@test.ru',
                    to: 'log@org.ru',
                    date: new Date().toISOString(),
                    box: 'inbox',
                    read: true,
                    body: 'Подробный текст письма от клиента.',
                    attachments: [{ name: 'order.pdf' }],
                };
            }
            return {};
        },
    };
    assert(!el.$('[slot="top-panel"]'), 'нет кнопок в slot=top-panel фиолетовой шапки');
    const row = await waitFor(() => el.$('div.msg-row'), 'письмо в плоском списке');
    assert(el.$('.nav-badge')?.textContent.trim() === '1', 'бейдж непрочитанных на папке Входящие');
    row.click();
    await waitFor(() => readCalled && el.$('.view-body')?.textContent.includes('Подробный текст'), () => `письмо открыто (readCalled=${readCalled}, mode=${el.mode}, rowTag=${row.tagName})`);
    el.$('.compose-btn').click();
    await waitFor(() => el.$('.compose-wrap'), 'открыта форма написания письма');
    el.remove();
});

await test('Система: левое боковое меню .sys-sidebar без вкладки Поиск и доступ только для BOSS', async () => {
    // 1. Для обычного сотрудника (не BOSS) доступ к Системе закрыт
    const deniedEl = document.createElement('test-sys-view');
    deniedEl.style.cssText = 'display:flex;width:900px;height:550px;';
    document.body.appendChild(deniedEl);
    deniedEl.isBossDenied = true;
    await waitFor(() => deniedEl.$('.denied-msg')?.textContent.includes('только руководителю'), 'сообщение о доступе только BOSS');
    assert(!deniedEl.$('.sys-sidebar'), 'меню Системы скрыто от не-BOSS');
    deniedEl.remove();

    // 2. Для BOSS меню Системы открыто (у $base есть и Классы и модули)
    const el = document.createElement('test-sys-view');
    el.style.cssText = 'display:flex;width:900px;height:550px;';
    document.body.appendChild(el);
    el.$item = {
        id: 'OrgDemo', path: '/ORGANIZATIONS/OrgDemo', type: '$base',
        isBoss: Promise.resolve(true),
        METADATA: Promise.resolve({ STATIC: [], FIELDS: [] }),
        get body() {
            return Promise.resolve({
                '#security': {
                    BOSS: [],
                    ROLES: [{
                        id: 'head',
                        label: 'Главный бухгалтер',
                        readonly: true,
                        USERS: ['U_REAL', 'AABBCCDDEEFF001', 'U_GHOST'],
                        LINKS: [{ id: '/ORGANIZATIONS/OrgDemo/MODULES/Register/OPERATIONS/Зарплата', access: 'read' }],
                        ROLES: [{
                            id: 'acc',
                            label: 'Бухгалтер',
                            USERS: [],
                            LINKS: [],
                        }],
                    }],
                },
            });
        },
        async fetch(method) {
            if (method === 'agent_staff_context') {
                return {
                    users: [
                        { id: 'U_REAL', label: 'Харитонов Юрий', icon: '', iconColor: '' },
                        { id: 'U_TOP', label: 'Главный Босс', icon: '', iconColor: '' },
                    ],
                    structures: [],
                    networkNodes: [
                        { id: 'partner-1', path: '/NODES/partner-1', principalId: 'AABBCCDDEEFF001', label: 'Сервер Партнёра', icon: 'icons:dns' },
                    ],
                    inheritedBoss: { fromPath: '/', fromLabel: 'WORK', users: [{ id: 'U_TOP', label: 'Главный Босс', icon: 'icons:person', iconColor: '' }] },
                    baseClasses: [{
                        id: 'Register',
                        path: '/ORGANIZATIONS/OrgDemo/MODULES/Register',
                        label: 'Бухучёт',
                        icon: 'odant:module',
                        children: [{
                            id: 'OPERATIONS',
                            path: '/ORGANIZATIONS/OrgDemo/MODULES/Register/OPERATIONS',
                            label: 'Операции',
                            icon: 'carbon:task-complete',
                            children: [{
                                id: 'Зарплата',
                                path: '/ORGANIZATIONS/OrgDemo/MODULES/Register/OPERATIONS/Зарплата',
                                label: 'Зарплата',
                                icon: 'odant:class',
                                children: [],
                            }],
                        }, {
                            id: 'CATALOGS',
                            path: '/ORGANIZATIONS/OrgDemo/MODULES/Register/CATALOGS',
                            label: 'Справочники',
                            icon: 'carbon:catalog',
                            children: [{
                                id: 'Склады',
                                path: '/ORGANIZATIONS/OrgDemo/MODULES/Register/CATALOGS/Склады',
                                label: 'Склады',
                                icon: 'odant:class',
                                children: [],
                            }],
                        }],
                    }],
                    systemModules: [],
                };
            }
            return {};
        },
    };
    const nav = await waitFor(() => el.$('.sys-sidebar'), 'левое боковое меню Системы');
    const labels = [...nav.querySelectorAll('.sys-tab')].map(b => b.textContent.trim());
    assert(labels.includes('Пользователи') && labels.includes('Классы и модули') && labels.includes('Мессенджеры') && labels.includes('Агент и правила'), 'разделы Системы у $base включают Классы и модули');
    assert(!labels.includes('Поиск'), 'Поиск вынесен из Системы');

    // 3. Проверка вкладки Пользователи: BOSS сверху, дерево классов $base, Настройка и Только просмотр
    const staffEl = await waitFor(() => el.$('system-tab-staff'), 'смонтирована вкладка Пользователи');
    assert(staffEl.$item?.set !== undefined || typeof (await import('/$server/$folder/$class/$structure/handlers/pages/form/system/$handler/tabs/staff.js')).default.$item?.set === 'function', '$item имеет сеттер reload');
    const rootRoleNode = await waitFor(() => staffEl.$('staff-role-node'), () => `единое дерево ролей (nodes=${staffEl.$$('staff-role-node')?.length}, err=${staffEl.error}, secRoles=${staffEl.security?.ROLES?.length})`);
    await waitFor(() => {
        const t = staffEl.$('.tree-box')?.textContent || '';
        return t.includes('Главный Босс') ? t : null;
    }, () => `отображается унаследованный BOSS сверху (text=${staffEl.$('.tree-box')?.textContent?.slice(0, 200)})`);
    const childRoleNode = await waitFor(() => rootRoleNode.$('staff-role-node'), 'дочерняя роль Бухгалтер внутри Главного бухгалтера');
    assert(childRoleNode, 'дочерняя роль отрисована рекурсивным компонентом');
    const roleHeaderText = rootRoleNode.$('.role-row')?.textContent || '';
    assert(roleHeaderText.includes('Харитонов Юрий'), 'отображён реальный пользователь в строке роли');
    assert(roleHeaderText.includes('Сервер Партнёра'), 'отображён сервер сети в строке роли');
    assert(!(staffEl.$('.tree-box')?.textContent || '').includes('U_GHOST'), 'несуществующие UID не отображаются абракадаброй');
    assert(!roleHeaderText.includes('U_GHOST'), 'несуществующие UID не отображаются в строке роли');
    assert(!roleHeaderText.includes('Пригласить'), 'нет лишней кнопки Пригласить');

    // Обычный режим: видна полная иерархия промежуточных классов (Бухучёт -> Операции -> Зарплата), без Справочники/Склады
    const filteredClasses = rootRoleNode.$$('.tree-row.class-row');
    assert(filteredClasses.length === 3, 'в обычном режиме сохранена иерархия Бухучёт -> Операции -> Зарплата (получено ' + filteredClasses.length + ': ' + JSON.stringify(filteredClasses.map(r => r.textContent.trim())) + ')');
    assert(!filteredClasses.some(r => r.textContent.includes('Склады')), 'неотмеченный класс Склады скрыт до включения Настройки');

    // Включаем режим "Настройка" у роли Главный бухгалтер реальным кликом по кнопке — появляются все ветки (Справочники с ▸)
    const setupBtn = [...rootRoleNode.$$('button.icon-btn')].find(b => b.textContent.includes('Настройка'));
    setupBtn.click();
    await waitFor(() => rootRoleNode.$$('.tree-row.class-row')?.length === 4, () => 'в режиме Настройка видны все 4 узла (setupMode=' + rootRoleNode.setupMode + ', classRows=' + rootRoleNode.classRows?.length + ', rows=' + rootRoleNode.$$('.tree-row.class-row')?.length + ')');
    // Раскрываем ветку Справочники кликом по стрелке — виден лист Склады (всего 5 строк)
    const catalogRow = [...rootRoleNode.$$('.tree-row.class-row')].find(r => r.textContent.includes('Справочники'));
    catalogRow.querySelector('.expander').click();
    await waitFor(() => rootRoleNode.$$('.tree-row.class-row')?.length === 5, 'после раскрытия ветки видны все 5 классов/веток');
    const checks = [...rootRoleNode.$$('.tree-row.class-row input[type="checkbox"]')].filter(c => getComputedStyle(c).display !== 'none');
    assert(checks.length === 5, 'у каждого узла дерева классов один видимый чекбокс (получено ' + checks.length + ')');
    assert(checks.some(c => c.checked) && checks.some(c => !c.checked), 'отмечен только привязанный класс');

    // Проверяем вкладку "Классы и модули"
    const modTabBtn = [...nav.querySelectorAll('.sys-tab')].find(b => b.textContent.includes('Классы и модули'));
    modTabBtn.dispatchEvent(new MouseEvent('tap', { bubbles: true, composed: true }));
    if (el.currentTabId !== 'modules') el.selectTab('modules');
    await waitFor(() => el.$('system-tab-modules'), 'смонтирована вкладка Классы и модули');

    const staffSrc = await fetch('/$server/$folder/$class/$structure/handlers/pages/form/system/$handler/tabs/staff.js').then(r => r.text());
    assert(!staffSrc.includes('<oda-messenger-settings'), 'нет дублирующих настроек мессенджеров на вкладке Пользователи');
    assert(staffSrc.includes('WORK.showDropdown') && staffSrc.includes('window.prompt'), 'используются штатный showDropdown и нативный prompt');
    assert(staffSrc.includes('onBossDrop') && staffSrc.includes('onRoleDrop'), 'поддержан drag&drop людей, подразделений, серверов и классов');

    // 4. Проверка вкладки Агент и правила: инструкция, скрытая форма реакций и ODANT-маска времени
    const agentTabBtn = [...nav.querySelectorAll('.sys-tab')].find(b => b.textContent.includes('Агент и правила'));
    agentTabBtn.dispatchEvent(new MouseEvent('tap', { bubbles: true, composed: true }));
    if (el.currentTabId !== 'agent') el.selectTab('agent');
    const agentEl = await waitFor(() => el.$('system-tab-agent'), 'смонтирована вкладка Агент и правила');
    assert(agentEl.maskPreview.ok && agentEl.maskPreview.text.includes('5-го числа'), 'расшифровка ODANT-маски YYYY-MM-05T10:15:00: ' + agentEl.maskPreview.text);
    const agentSrc = await fetch('/$server/$folder/$class/$structure/handlers/pages/form/system/$handler/tabs/agent.js').then(r => r.text());
    assert(agentSrc.includes('Системная инструкция для агента этого подразделения'), 'есть редактор системного промпта');
    assert(agentSrc.includes('Автоматические реакции'), 'блок переименован в Автоматические реакции');
    assert(agentSrc.includes('Повторять задачу'), 'можно выбрать готовую задачу в расписание');
    el.remove();
});
window.__done = true;
</script>
</body>
</html>
