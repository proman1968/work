<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Tree load UI tests</title></head>
<body>
<script type="module">
/**
 * Лишние запросы строки дерева (tests/ui/run.mjs): роли и «?» берутся из данных элемента,
 * пользователи — из общего списка /USERS, предзагрузка не трогает скрытые узлы.
 */
await import('/sources/client.js');
const nodeProto = (await import('/$server/$folder/lib/node/node.js')).default;
const treeModule = await import('/$server/$folder/lib/tree/tree.js');
const treeProto = treeModule.default;
const { knownHasItems } = treeModule;

const results = [];
window.__results = results;
async function test(name, fn) {
    try {
        await fn();
        results.push({ name, ok: true });
    }
    catch (e) {
        results.push({ name, ok: false, error: String(e?.stack || e) });
    }
}
function assert(v, msg) {
    if (!v)
        throw new Error(msg || 'assert');
}
function eq(a, b, msg) {
    if (JSON.stringify(a) !== JSON.stringify(b))
        throw new Error((msg || 'eq') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
const getter = (proto, name) => Object.getOwnPropertyDescriptor(proto, name).get;

await test('usersByIds: общий список, добор по одному только недостающих', async () => {
    const calls = [];
    const prev = { users: WORK._users, get_item: WORK.get_item };
    WORK._users = Promise.resolve([{ id: 'a', n: 1 }, { id: 'c', n: 3 }]);
    WORK.get_item = async (p) => { calls.push(p); return { id: p.split('/').pop() }; };
    try {
        const got = await WORK.usersByIds(['c', 'b', 'a']);
        eq(got.map(u => u.id), ['c', 'b', 'a'], 'порядок как в ids');
        eq(calls, ['/USERS//b'], 'добор только b');
        eq(await WORK.usersByIds([]), [], 'пусто');
        eq(calls.length, 1, 'для пустых ids запросов нет');
    }
    finally {
        WORK._users = prev.users;
        WORK.get_item = prev.get_item;
    }
});

await test('$class.users/bosses: из roleIds без запроса, без roleIds — прежний fetch', async () => {
    const fetched = [];
    const prevUsers = WORK._users;
    WORK._users = Promise.resolve([{ id: 'u1' }, { id: 'b1' }]);
    try {
        const proto = CORE.$class.prototype;
        const withIds = {
            DATA: { roleIds: { ADMIN: [], BOSS: ['b1'], USER: ['u1'], GUEST: [] } },
            fetch: (m) => { fetched.push(m); return Promise.resolve([]); },
            _roleUsers: proto._roleUsers,
        };
        eq((await getter(proto, 'users').call(withIds)).map(u => u.id), ['u1']);
        eq((await getter(proto, 'bosses').call(withIds)).map(u => u.id), ['b1']);
        eq(await getter(proto, 'admins').call(withIds), []);
        eq(fetched, [], 'запросов нет');
        const legacy = { DATA: {}, fetch: (m) => { fetched.push(m); return Promise.resolve(['x']); }, _roleUsers: proto._roleUsers };
        eq(await getter(proto, 'users').call(legacy), ['x']);
        eq(fetched, ['users'], 'нет roleIds — прежний запрос');
    }
    finally {
        WORK._users = prevUsers;
    }
});

await test('item-node: знака «?» в строке больше нет', async () => {
    assert(!nodeProto.template.includes('readme-help'), 'нет иконки');
    assert(!nodeProto.template.includes('openReadme'), 'нет клика');
    assert(!Object.getOwnPropertyDescriptor(nodeProto, 'hasReadme'), 'нет геттера');
    assert(!Object.getOwnPropertyDescriptor(nodeProto, 'readmeItem'), 'нет поиска файла');
});

await test('tree.getItems: неадмину у корня предзагрузка только классов', async () => {
    const asked = [];
    const prevDev = WORK.DEV_MODE;
    WORK.DEV_MODE = false;
    const mk = (id, cls) => {
        const o = Object.create(cls ? CORE.$class.prototype : CORE.$file.prototype);
        Object.defineProperty(o, 'id', { value: id });
        Object.defineProperty(o, 'items', { get() { asked.push(id); return Promise.resolve([]); } });
        return o;
    };
    try {
        const root = { type: '$server', isAdmin: Promise.resolve(false), items: Promise.resolve([mk('BASE', true), mk('config.json', false), mk('USERS', true)]) };
        const tree = { itemsSelector: 'items', getItems: treeProto.getItems };
        await treeProto.getItems.call(tree, root, 1);
        eq(asked.sort(), ['BASE', 'USERS'], 'файл корня не запрашивался');
        asked.length = 0;
        root.isAdmin = Promise.resolve(true);
        await treeProto.getItems.call(tree, root, 1);
        eq(asked.sort(), ['BASE', 'USERS', 'config.json'], 'админу — всё как раньше');
        asked.length = 0;
        root.isAdmin = Promise.resolve(false);
        WORK.DEV_MODE = true;
        await treeProto.getItems.call(tree, root, 1);
        eq(asked.sort(), ['BASE', 'USERS', 'config.json'], 'в режиме отладки (DEV_MODE) — все классы и папки видны любому пользователю');
    }
    finally {
        WORK.DEV_MODE = prevDev;
    }
});

await test('__bind: пустой список из ответа — знание «детей нет», а не повод для @items', async () => {
    const item = WORK.__bind({ path: '/T1', id: 'T1', type: '$class', items: [], hasItems: false });
    assert(Array.isArray(item[R].cache.items), 'items в кэше');
    eq(item[R].cache.items.length, 0);
    const deep = WORK.__bind({ path: '/T2', id: 'T2', type: '$class', items: [
        { path: '/T2/A', id: 'A', type: '$class', items: [{ path: '/T2/A/B', id: 'B', type: '$class', hasItems: true }] },
    ] });
    const a = deep[R].cache.items[0];
    eq(a.path, '/T2/A');
    eq(a[R].cache.items[0].path, '/T2/A/B', 'вложенный уровень разложен');
    eq(a[R].cache.items[0].DATA.hasItems, true);
});

await test('_onEmpty(items): один info с глубиной 1, дети приходят с hasItems', async () => {
    const calls = [];
    const prev = WORK.fetch;
    WORK.fetch = async (url, method, params) => {
        calls.push({ url, method, params });
        return { path: '/T3', items: [{ path: '/T3/X', id: 'X', type: '$class', hasItems: false }] };
    };
    try {
        const item = WORK.__bind({ path: '/T3', id: 'T3', type: '$class' });
        const items = await item.items;
        eq(calls.length, 1);
        eq(calls[0].method, 'info');
        eq(calls[0].params.deep, 1);
        assert(calls[0].url.endsWith('/T3'), calls[0].url);
        eq(items.map(i => i.path), ['/T3/X']);
        eq(items[0].DATA.hasItems, false);
    }
    finally {
        WORK.fetch = prev;
    }
});

await test('стрелка по hasItems без чтения items; ссылки и фильтры — по items', async () => {
    const pdp = { itemsSelector: 'items' };
    const mk = (data, type = '$class') => WORK.__bind({ path: '/K/' + Math.random(), id: 'k', type, ...data });
    eq(knownHasItems(mk({ hasItems: true }), pdp), true);
    eq(knownHasItems(mk({ hasItems: false }), pdp), false);
    eq(knownHasItems(mk({}), pdp), undefined, 'без флага — неизвестно');
    eq(knownHasItems(mk({ hasItems: false }), { ...pdp, onlyClasses: true }), undefined, 'фильтр дерева');
    const link = Object.create(mk({ hasItems: false }));
    link.isLink = true;
    eq(knownHasItems(link, pdp), undefined, 'ссылка');
    const item = mk({ hasItems: false });
    delete item.DATA.hasItems;
    eq(knownHasItems(item, pdp), undefined, 'после changed флаг снят — снова по items');
});

await test('getItems: узлы с флагом не догружаются заранее, загруженные — проходятся', async () => {
    const asked = [];
    const mk = (id, data, items) => {
        const o = { id, DATA: data, [R]: { cache: items ? { items } : {} } };
        Object.defineProperty(o, 'items', { get() { asked.push(id); return Promise.resolve(items || []); } });
        return o;
    };
    const leafKnown = mk('known', { hasItems: true });
    const leafEmpty = mk('empty', { hasItems: false });
    const leafLegacy = mk('legacy', {});
    const root = mk('root', { hasItems: true }, [leafKnown, leafEmpty, leafLegacy]);
    const tree = { itemsSelector: 'items', getItems: treeProto.getItems };
    await treeProto.getItems.call(tree, root, 1);
    eq(asked.sort(), ['legacy', 'root'], 'запросы только у корня и узла без флага');
});

await test('prefetch: info точки входа с глубиной, списки разложены, повтор не шлёт запрос', async () => {
    const calls = [];
    const prev = WORK.fetch;
    WORK.fetch = async (url, method, params) => {
        calls.push({ method, params });
        return { path: '/P', hasItems: true, items: [{ path: '/P/A', id: 'A', type: '$class', hasItems: true, items: [{ path: '/P/A/B', id: 'B', type: '$class', hasItems: false }] }] };
    };
    try {
        const item = WORK.__bind({ path: '/P', id: 'P', type: '$class' });
        const tree = { prefetchDeep: 3, itemsSelector: 'items' };
        await treeProto.prefetch.call(tree, item);
        eq(calls.length, 1);
        eq(calls[0].method, 'info');
        eq(calls[0].params.deep, 3);
        eq(calls[0].params.branch, 'classes');
        eq(item[R].cache.items.map(i => i.path), ['/P/A']);
        eq(item[R].cache.items[0][R].cache.items[0].DATA.hasItems, false);
        await treeProto.prefetch.call(tree, item);
        eq(calls.length, 1, 'уже загружено — без запроса');
        await treeProto.prefetch.call({ prefetchDeep: 0, itemsSelector: 'items' }, WORK.__bind({ path: '/P2', id: 'P2', type: '$class' }));
        eq(calls.length, 1, 'prefetchDeep 0 — выключено');
    }
    finally {
        WORK.fetch = prev;
    }
});

await test('Консультант ИИ: переключатель ИИ в проводнике, кнопка Консультант на форме и создание .task в личных логах', async () => {
    const explorerProto = (await import('/$server/$folder/lib/explorer/explorer.js')).default;
    await import('/$server/$folder/handlers/pages/form/$handler/form.js');
    await import('/$server/$folder/lib/consultant/consultant.js');
    await ODA.waitReg('work-form');
    await ODA.waitReg('item-consultant');

    assert(explorerProto.template.includes('item-consultant'), 'item-consultant в left-panel проводника');
    assert(explorerProto.template.includes('label="ИИ"'), 'кнопка ИИ в панели переключателей');
    assert(typeof explorerProto.openConsultant === 'function', 'метод openConsultant на проводнике');

    const wfEl = document.createElement('work-form');
    wfEl.$item = WORK.__bind({ path: '/ORGANIZATIONS/Маслоторг/MODULES/Register/CATALOGS/Номенклатура', id: 'Номенклатура', label: 'Номенклатура', type: '$catalog' });
    wfEl.view = { id: 'objects', label: 'Объекты', importView: async () => {} };
    wfEl.view_control = { total: 4, from: '2026-01-01', to: '2026-10-27', focusedRow: { name: 'Бочка 200 л' } };
    const ctx = wfEl.buildConsultantContext();
    assert(ctx.title.includes('Номенклатура'), 'заголовок консультации: ' + ctx.title);
    assert(ctx.prompt.includes('/ORGANIZATIONS/Маслоторг/MODULES/Register/CATALOGS/Номенклатура'), 'путь в вопросе');
    assert(ctx.prompt.includes('Бочка 200 л'), 'выбранная строка в вопросе');
    assert(ctx.prompt.includes('записей на экране: 4'), 'количество записей в вопросе');

    const consEl = document.createElement('item-consultant');
    assert(consEl.label === 'ИИ', 'метка вкладки ИИ');
    let savedFile = null, savedParams = null;
    const fakeCabinet = {
        id: 'CA4E097FF6C1D387',
        path: '/USERS/CA4E097FF6C1D387',
        save_file: async (file, params) => {
            savedFile = file;
            savedParams = params;
            return { DATA: { path: '/USERS/CA4E097FF6C1D387/$user/USER/task/2026-10-27/1790000000000.CA4E097FF6C1D387.task' } };
        },
    };
    const prevGetItem = WORK.get_item;
    WORK.get_item = async (p) => WORK.__bind({
        path: p,
        id: p.split('/').pop(),
        type: '$file',
        load: async () => JSON.stringify({ name: ctx.title, prompt: ctx.prompt, status: 'running', items: [{ id: '1', type: 'user', content: ctx.prompt, time: Date.now() }] }),
    });
    consEl._getPersonalCabinet = async () => fakeCabinet;
    consEl._hydrateModel = async () => { consEl.model = '/MODELS/odant/Qwen3.8 27b'; };
    try {
        const created = await consEl.askAboutContext(ctx);
        assert(!!created, 'задача создана');
        assert(savedFile && savedFile.name.endsWith('.task'), 'сохранён .task файл: ' + savedFile?.name);
        eq(savedParams.role, 'USER', 'сохранено в зону USER личного кабинета');
        eq(savedParams.prompt, ctx.prompt, 'вопрос по форме передан в prompt');
    }
    finally {
        WORK.get_item = prevGetItem;
    }
});

await test('Проводник: порядок вкладок [контекст, USERS, Сеть, ИИ], кнопка звонка только при звонке, размеры иконок ($server/$base/$user=48px, $structure=32px)', async () => {
    await import('/oda/components/layouts/app-layout/app-layout.js');
    await ODA.waitReg('oda-app-layout');
    await ODA.waitReg('app-layout-drawer');
    await ODA.waitReg('app-tabs');

    const layout = document.createElement('oda-app-layout');
    layout.style.cssText = 'position: fixed; inset: 0; width: 1200px; height: 800px;';
    // Специально добавляем вразнобой (USERS, Сеть, WORK, ИИ), чтобы проверить сортировку по order
    const mkPane = (label, icon, order) => {
        const el = document.createElement('div');
        el.setAttribute('slot', 'left-panel');
        el.setAttribute('label', label);
        el.setAttribute('icon', icon);
        el.setAttribute('order', String(order));
        return el;
    };
    layout.appendChild(mkPane('USERS', 'social:people', 1));
    layout.appendChild(mkPane('Сеть', 'carbon:network-3', 2));
    layout.appendChild(mkPane('WORK', 'odant:structure', 0));
    layout.appendChild(mkPane('ИИ', 'bootstrap:robot', 3));
    document.body.appendChild(layout);
    await new Promise(r => setTimeout(r, 300));

    const drawer = layout.left_drawer;
    assert(!!drawer, 'left_drawer найден');
    assert(!drawer.hidden, 'left_drawer НЕ скрыт (hidden=false)');
    const tabs = drawer.$('app-tabs');
    assert(!!tabs, 'app-tabs внутри left_drawer найден');
    eq(tabs.items.map(i => i.label).join(','), 'WORK,USERS,Сеть,ИИ', 'порядок вкладок строго WORK,USERS,Сеть,ИИ');
    tabs.setIndex(1);
    eq(drawer.focusedIndex, 1, 'переключение вкладки в app-tabs');
    layout.remove();

    const explorerProto = (await import('/$server/$folder/lib/explorer/explorer.js')).default;
    top.RTCCaller = top.RTCCaller || {};
    top.RTCCaller.current_call = null;
    const btnsIdle = explorerProto._buildLeftButtons.call({ showUser: false, showCall: false });
    eq(btnsIdle.length, 2, 'без звонка внизу ровно 2 кнопки');
    top.RTCCaller.current_call = { active: true };
    const btnsCall = explorerProto._buildLeftButtons.call({ showUser: false, showCall: false });
    eq(btnsCall.length, 3, 'во время звонка внизу 3 кнопки');
    eq(btnsCall[0].icon, 'eva:o-phone-call-outline', 'первая кнопка при звонке — телефон');
    top.RTCCaller.current_call = null;

    const nodeProto = (await import('/$server/$folder/lib/node/node.js')).default;
    const sizeFor = (type, isUser = false, id = 'item') => Object.getOwnPropertyDescriptor(nodeProto, 'iconSize').get.call({
        isLink: false,
        isUser,
        isStructureLike: type === '$base' || type === '$structure' || type === '$server' || (type === '$node' && id !== 'NODES'),
        showStatus: true,
        $item: { type, id },
    });
    eq(sizeFor('$server'), 48, '$server iconSize = 48');
    eq(sizeFor('$base'), 48, '$base iconSize = 48');
    eq(sizeFor('$user', true), 48, '$user iconSize = 48');
    eq(sizeFor('$node', false, 'work.odant.org'), 48, 'сервер в Сети ($node) iconSize = 48');
    eq(sizeFor('$node', false, 'NODES'), 24, 'корень NODES iconSize = 24');
    eq(sizeFor('$structure'), 32, '$structure iconSize = 32');

    const { isChatModel, setUserPreferredModel, getUserPreferredModel } = await import('/$server/$folder/lib/prompt-bar/prompt-bar.js');
    eq(isChatModel({ type: '$ai', id: 'Qwen3-14B', DATA: { modality: 'llm', capabilities: ['chat'] } }), true, 'Qwen3-14B — языковая модель для чата');
    eq(isChatModel({ type: '$ai', id: 'Qwen3.8 27b', DATA: { capabilities: ['chat', 'stream'] } }), true, 'Qwen3.8 27b — языковая модель для чата');
    eq(isChatModel({ type: '$ai', id: 'Flux-Image', DATA: { modality: 'image', capabilities: ['image'] } }), false, 'Flux-Image скрыта из выбора в чате');
    eq(isChatModel({ type: '$ai', id: 'Qwen3-Embedding', DATA: { modality: 'embedding', capabilities: ['embedding'] } }), false, 'Qwen3-Embedding скрыта из выбора в чате');
    eq(isChatModel({ type: '$ai', id: 'Qwen3-Voice', DATA: { modality: 'audio', capabilities: ['asr', 'tts'] } }), false, 'Qwen3-Voice скрыта из выбора в чате');
    eq(isChatModel({ type: '$ai', id: 'Qwen3-ASR', DATA: { capabilities: ['stt'] } }), false, 'Qwen3-ASR скрыта из выбора в чате');
    eq(isChatModel({ type: '$ai', id: 'Qwen3-TTS', DATA: { capabilities: ['tts'] } }), false, 'Qwen3-TTS скрыта из выбора в чате');
    eq(isChatModel({ type: '$ai', id: 'Z-Image-Turbo', DATA: { modality: 'image', capabilities: ['image'] } }), false, 'Z-Image-Turbo скрыта из выбора в чате');

    setUserPreferredModel('/MODELS/Local/Qwen3-14B');
    eq(getUserPreferredModel(), '/MODELS/Local/Qwen3-14B', 'предпочитаемая модель сохраняется для пользователя независимо от подразделения');

    await import('/$server/$folder/lib/chat-item/chat-item.js');
    await ODA.waitReg('chat-item');
    const ci = document.createElement('chat-item');
    WORK.uid = 'u1';
    ci.senderId = 'u1';
    ci.log = { ext: 'msg', content: 'исходящее' };
    eq(ci.cardLayoutStyle.marginLeft, '0px', 'исходящее сообщение — слева (marginLeft=0px)');
    eq(ci.cardLayoutStyle.marginRight, 'auto', 'исходящее сообщение — слева (marginRight=auto)');

    ci.senderId = 'u2';
    ci.log = { ext: 'msg', content: 'входящее' };
    eq(ci.cardLayoutStyle.marginLeft, 'auto', 'входящее сообщение — справа (marginLeft=auto)');
    eq(ci.cardLayoutStyle.marginRight, '0px', 'входящее сообщение — справа (marginRight=0px)');

    ci.senderId = 'u1';
    ci.log = { ext: 'task', path: '/ORG/1.u1.task' };
    eq(ci.cardLayoutStyle.marginLeft, '48px', 'карточка таска — по центру с отступом слева 48px');
    eq(ci.cardLayoutStyle.marginRight, '48px', 'карточка таска — по центру с отступом справа 48px');
});

window.__done = true;
</script>
</body>
</html>
