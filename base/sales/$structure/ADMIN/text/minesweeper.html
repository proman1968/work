<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сапёр</title>
<style>
  :root{
    --bg:#2b2f36; --panel:#3a4048; --cell:#5a6470; --cell-open:#c8cdd4;
    --cell-flag:#e05a4e; --text:#eef1f5; --accent:#4ea1ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif; padding:16px;
  }
  h1{margin:0; font-size:26px; letter-spacing:1px;}
  .topbar{
    display:flex; align-items:center; gap:16px;
    background:var(--panel); padding:10px 16px; border-radius:10px;
  }
  .stat{
    font-variant-numeric:tabular-nums; font-size:22px; font-weight:700;
    background:#1f2329; padding:4px 12px; border-radius:8px; min-width:64px;
    text-align:center; color:#ff6b5e;
  }
  .face{
    font-size:26px; background:#1f2329; border:none; border-radius:8px;
    width:48px; height:48px; cursor:pointer; transition:transform .1s;
  }
  .face:active{transform:scale(.92);}
  .board{
    display:grid; gap:3px; background:var(--panel); padding:10px;
    border-radius:10px; user-select:none;
  }
  .cell{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--cell); border-radius:5px; cursor:pointer; font-weight:700;
    font-size:16px; transition:background .08s;
  }
  .cell:hover{background:#6b7684;}
  .cell.open{background:var(--cell-open); cursor:default; color:#222;}
  .cell.open:hover{background:var(--cell-open);}
  .cell.mine{background:var(--cell-flag);}
  .cell.boom{background:#ff3b30;}
  .n1{color:#2b6cff}.n2{color:#2e9e44}.n3{color:#e05a4e}
  .n4{color:#7a3fb0}.n5{color:#a0522d}.n6{color:#1f8a8a}
  .n7{color:#333}.n8{color:#777}
  .status{font-size:18px; min-height:24px; font-weight:600;}
  .status.win{color:#5ad06a}.status.lose{color:#ff6b5e}
  .hint{font-size:13px; opacity:.7;}
</style>
</head>
<body>
  <h1>Сапёр</h1>
  <div class="topbar">
    <div class="stat" id="mines">10</div>
    <button class="face" id="face" title="Новая игра">🙂</button>
    <div class="stat" id="timer">0</div>
  </div>
  <div class="board" id="board"></div>
  <div class="status" id="status"></div>
  <div class="hint">ЛКМ — открыть · ПКМ — флаг</div>

<script>
(function(){
  const ROWS=10, COLS=10, MINES=10;
  const boardEl=document.getElementById('board');
  const minesEl=document.getElementById('mines');
  const timerEl=document.getElementById('timer');
  const faceEl=document.getElementById('face');
  const statusEl=document.getElementById('status');

  boardEl.style.gridTemplateColumns=`repeat(${COLS},34px)`;

  let grid, revealed, flagged, started, gameOver, timer, seconds, flags;

  function reset(){
    grid=[]; revealed=[]; flagged=[];
    started=false; gameOver=false; flags=0; seconds=0;
    clearInterval(timer); timer=null;
    timerEl.textContent='0';
    minesEl.textContent=MINES;
    faceEl.textContent='🙂';
    statusEl.textContent='';
    statusEl.className='status';
    boardEl.innerHTML='';
    for(let r=0;r<ROWS;r++){
      grid[r]=[]; revealed[r]=[]; flagged[r]=[];
      for(let c=0;c<COLS;c++){
        grid[r][c]=0; revealed[r][c]=false; flagged[r][c]=false;
        const cell=document.createElement('div');
        cell.className='cell';
        cell.dataset.r=r; cell.dataset.c=c;
        cell.addEventListener('click',()=>open(r,c));
        cell.addEventListener('contextmenu',e=>{e.preventDefault();flag(r,c);});
        boardEl.appendChild(cell);
      }
    }
  }

  function placeMines(safeR,safeC){
    let placed=0;
    while(placed<MINES){
      const r=Math.floor(Math.random()*ROWS);
      const c=Math.floor(Math.random()*COLS);
      if(grid[r][c]===-1) continue;
      if(Math.abs(r-safeR)<=1 && Math.abs(c-safeC)<=1) continue; // первый клик безопасен
      grid[r][c]=-1; placed++;
    }
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(grid[r][c]===-1) continue;
      let n=0;
      forEachNeighbor(r,c,(nr,nc)=>{ if(grid[nr][nc]===-1) n++; });
      grid[r][c]=n;
    }
  }

  function forEachNeighbor(r,c,fn){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0) continue;
      const nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) fn(nr,nc);
    }
  }

  function cellEl(r,c){ return boardEl.children[r*COLS+c]; }

  function startTimer(){
    timer=setInterval(()=>{ seconds++; timerEl.textContent=seconds; },1000);
  }

  function open(r,c){
    if(gameOver || flagged[r][c] || revealed[r][c]) return;
    if(!started){ started=true; placeMines(r,c); startTimer(); }
    if(grid[r][c]===-1){ lose(r,c); return; }
    reveal(r,c);
    checkWin();
  }

  function reveal(r,c){
    if(revealed[r][c] || flagged[r][c]) return;
    revealed[r][c]=true;
    const el=cellEl(r,c);
    el.classList.add('open');
    const n=grid[r][c];
    if(n>0){ el.textContent=n; el.classList.add('n'+n); }
    else{ forEachNeighbor(r,c,(nr,nc)=>reveal(nr,nc)); }
  }

  function flag(r,c){
    if(gameOver || revealed[r][c]) return;
    flagged[r][c]=!flagged[r][c];
    const el=cellEl(r,c);
    el.textContent=flagged[r][c]?'🚩':'';
    flags+=flagged[r][c]?1:-1;
    minesEl.textContent=MINES-flags;
  }

  function lose(r,c){
    gameOver=true; clearInterval(timer);
    faceEl.textContent='😵';
    statusEl.textContent='Подрыв! Попробуйте ещё раз.';
    statusEl.className='status lose';
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
      if(grid[i][j]===-1 && !flagged[i][j]){
        const el=cellEl(i,j); el.classList.add('mine'); el.textContent='💣';
      }
      if(flagged[i][j] && grid[i][j]!==-1){
        const el=cellEl(i,j); el.textContent='❌';
      }
    }
    const boom=cellEl(r,c); boom.classList.add('boom'); boom.textContent='💥';
  }

  function checkWin(){
    let openCount=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(revealed[r][c]) openCount++;
    if(openCount===ROWS*COLS-MINES){
      gameOver=true; clearInterval(timer);
      faceEl.textContent='😎';
      statusEl.textContent='Победа! Время: '+seconds+' с';
      statusEl.className='status win';
    }
  }

  faceEl.addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
