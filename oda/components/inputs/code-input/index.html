<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<style>/*oda-critical*/html{color-scheme:light dark;background:light-dark(#f4f2f9,#191622);color:light-dark(#241f31,#ece8f5);}body{margin:0;visibility:hidden;min-height:100vh;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-input</title>
<script type="module" src="/oda/oda.js"></script>
<script type="module" src="./code-input.js"></script>
<div vertical style="padding: var(--space-l); gap: var(--space-m); max-width: 40em; overflow: auto;">
<oda-code-input id="a" field='{"label":"Скрипт","mode":"javascript"}'></oda-code-input>
<oda-code-input id="b" mode="json" readonly field='{"label":"JSON (только чтение)"}'></oda-code-input>
</div>
<script type="module">
a.value = 'function hello(name) {\n    return `Привет, ${name}!`;\n}\n';
b.value = JSON.stringify({ id: 1, tags: ['a', 'b'] }, null, 2);
</script>
