<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<style>/*oda-critical*/html{color-scheme:light dark;background:light-dark(#f4f2f9,#191622);color:light-dark(#241f31,#ece8f5);}body{margin:0;visibility:hidden;min-height:100vh;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oda-table-input</title>
<script type="module" src="/oda/oda.js"></script>
<script type="module" src="./table-input.js"></script>
<div vertical style="padding: var(--space-l); gap: var(--space-m); max-width: 64em;">
    <oda-table-input id="goods"></oda-table-input>
    <oda-table-input id="ro" readonly collapsed></oda-table-input>
</div>
<script type="module">
    ro.field = goods.field = { label: 'Товары',
        columns: [
            { id: 'article', label: 'Артикул', type: 'String' },
            { id: 'name', label: 'Наименование', type: 'String' },
            {
                id: 'unit', label: 'Ед.изм', type: 'Select',
                options: [
                    { value: 'пара', label: 'пара' },
                    { value: 'шт.', label: 'шт.' },
                    { value: 'кг', label: 'кг' },
                ],
            },
            { id: 'qty', label: 'Количество', type: 'Number' },
            { id: 'price', label: 'Цена', type: 'Number' },
            { id: 'sum', label: 'Сумма', type: 'Number', calc: 'qty * price', total: true },
            { id: 'arrival', label: 'Поставка', type: 'Date' },
            { id: 'paid', label: 'Оплачен', type: 'Boolean' },
        ],
    };
    ro.value = goods.value = [
        { article: '123456', name: 'Туфли зелёные', unit: 'пара', qty: 2, price: 3.3, arrival: '2022-04-21', paid: true },
        { article: '111111', name: 'Туфли зелёные', unit: 'шт.', qty: 8, price: 5.5, arrival: '2022-04-22', paid: false },
        { article: '212121', name: 'Трусы семейные', unit: 'шт.', qty: 10, price: 20, arrival: '2022-04-23', paid: true },
    ];
</script>
