<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<style>/*oda-critical*/html{color-scheme:light dark;background:light-dark(#f4f2f9,#191622);color:light-dark(#241f31,#ece8f5);}body{margin:0;visibility:hidden;min-height:100vh;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radio</title>
<script type="module" src="/oda/oda.js"></script>
<script type="module" src="./radio.js"></script>
<div vertical style="padding: var(--space-l); gap: var(--space-m); max-width: 36em; overflow: auto;">
<oda-radio-input id="r1" value="b"></oda-radio-input>
<oda-radio-input id="r2" inline allow-other></oda-radio-input>
<oda-radio-input id="r3" value="a" readonly></oda-radio-input>
</div>
<script type="module">
    const items = [{ value: 'a', label: 'Первый', icon: 'icons:home', description: 'пояснение варианта' }, { value: 'b', label: 'Второй', icon: 'icons:star' }, { value: 'c', label: 'Третий', disabled: true }];
    for (const el of document.querySelectorAll('[id^=r]')) el.items = items;
    r2.value = r2.localName === 'oda-tags-input' || r2.multiple ? ['a', 'свой'] : r2.value;
    r3.value = r3.localName === 'oda-tags-input' ? ['a', 'b'] : r3.value;
</script>
