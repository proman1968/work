<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="light dark">
<style>/*oda-critical*/html{color-scheme:light dark;background:light-dark(#f4f2f9,#191622);color:light-dark(#241f31,#ece8f5);}body{margin:0;visibility:hidden;min-height:100vh;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="ODA Framework - designed for rapid development of websites, mobile PWAs and web applications using web components technology - https://odajs.org/" />
        <title>oda-code-editor</title>
    </head>

    <body>
<!--        <oda-tester>-->
            <oda-code-editor id="editor" mode="html" style="flex: 1" enable-breakpoints></oda-code-editor>
<!--        </oda-tester>-->

        <script type="module">
            import '/oda/oda.js';
            import './code-editor.js';
            editor.src = `
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0; }
    html {
        box-sizing: border-box;
    }
    *, *::before, *::after {
        box-sizing: inherit;
    }
</style>
            `
        </script>
    </body>

</html>
