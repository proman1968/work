<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<style>/*oda-critical*/html{color-scheme:light dark;background:light-dark(#f4f2f9,#191622);color:light-dark(#241f31,#ece8f5);}body{margin:0;visibility:hidden;min-height:100vh;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oda-table</title>
<script type="module" src="/oda/oda.js"></script>
<script type="module" src="./table.js"></script>
<script type="module" src="/oda/components/inputs/text/text.js"></script>
<script type="module" src="/oda/components/inputs/checkbox/checkbox.js"></script>
<script type="module" src="/oda/components/button/button.js"></script>
<div vertical flex style="padding: var(--space-m); gap: var(--space-s); overflow: hidden;">
    <div horizontal no-flex style="gap: var(--space-m); align-items: center;">
        <oda-text-input id="search" flex placeholder="Поиск по таблице" clearable></oda-text-input>
        <oda-checkbox id="edit" caption="правка ячеек" value></oda-checkbox>
        <oda-checkbox id="group" caption="группировка"></oda-checkbox>
        <oda-button id="expand" label="Развернуть всё" border></oda-button>
        <oda-button id="collapse" label="Свернуть всё" border></oda-button>
        <span id="log" style="color: var(--muted-color); font-size: var(--font-size-s);"></span>
    </div>
    <oda-table id="table" flex show-header show-column-filter allow-sort allow-focus allow-row-panel col-lines row-lines even-odd editable auto-fit allow-check="double"></oda-table>
</div>
<script type="module">
    import { CONTROLS } from '/oda/components/structure/controls.js';
    await customElements.whenDefined('oda-table');
    table.controls = CONTROLS;
    table.columns = [
        { name: 'title', label: 'Задача', treeMode: true, fix: 'left', control: 'oda-text-input' },
        { name: 'status', label: 'Статус', type: 'select', options: [{ value: 'new', label: 'Новая' }, { value: 'work', label: 'В работе' }, { value: 'done', label: 'Готово' }] },
        { name: 'plan', label: 'План', items: [
            { name: 'due', label: 'Срок', type: 'date' },
            { name: 'hours', label: 'Часы', type: 'number' }
        ] },
        { name: 'priority', label: 'Приоритет', type: 'rating', width: 140 },
        { name: 'urgent', label: 'Срочно', type: 'boolean' },
        { name: 'note', label: 'Заметка' }
    ];
    table.dataSet = [
        { title: 'Релиз 1.0', status: 'work', priority: 5, expanded: true, items: [
            { title: 'Дизайн', status: 'done', due: '2026-09-01', hours: 12, priority: 3 },
            { title: 'Разработка', status: 'work', due: '2026-10-01', hours: 80, priority: 5, urgent: true, expanded: true, items: [
                { title: 'Поля ввода', status: 'done', hours: 30 },
                // настройка на уровне строки и ячейки: $fields['*'] и $fields[колонка]
                { title: 'Таблица (только чтение)', status: 'work', hours: 40, readonly: true },
                { title: 'Формы', status: 'new', hours: 10, $fields: { note: { control: 'oda-color-input' } }, note: '#4b0082' }
            ] },
            { title: 'Тестирование', status: 'new', due: '2026-10-15', hours: 24, priority: 2 }
        ] },
        { title: 'Документация', status: 'new', priority: 1, note: 'readme + демо' },
        { title: 'Поддержка', status: 'work', priority: 2, expanded: true, items: [
            { title: 'Письма', status: 'done', hours: 6, note: 'очередь разобрана' },
            { title: 'Звонки', status: 'new', hours: 4, urgent: true }
        ] }
    ];
    search.addEventListener('value-changed', e => table.filter = e.detail.value);
    edit.addEventListener('value-changed', e => table.editable = e.detail.value);
    group.addEventListener('value-changed', e => table.showGroupPanel = e.detail.value);
    expand.addEventListener('click', () => table.expandAll());
    collapse.addEventListener('click', () => table.collapseAll());
    table.addEventListener('cell-changed', e => log.textContent = `${e.detail.value.column?.name} = ${JSON.stringify(e.detail.value.value)}`);
</script>
