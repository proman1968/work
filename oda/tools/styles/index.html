<head>
    <meta name="theme-color" content="#9CC2CE">

</head>

<style>

        --my-style {

        position: center;
    }
    div{

<style>
    :root{
        --my-my-style: {
            color: yellow;
            background-color: red;
        };
    }
    .horizontal{
        position: center;
    }

        @apply --my-style;

</style>

</body>

<script type="module">
    for (let i of document.querySelectorAll('style')){
        for (let rule of i.sheet.rules){
            if (rule.selectorText === ':root')
                console.dir(rule)
        }
    }
</script>
