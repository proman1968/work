<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#4b0082">
    <meta name="color-scheme" id="color-scheme" content="light dark">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, width=device-width">
    <meta name="description" content="odb content">
    <link rel="manifest" href="{item_path}?manifest" crossorigin="use-credentials">
    <link rel="icon" type="image/svg+xml" href="{item_icon_path}" crossorigin="use-credentials">
    <title>{title}</title>
    <style>
        body{
            visibility: hidden;
            overflow: hidden !important;
        }
    </style>
</head>
<body>
    <dev-mode-panel id="devModePanel" style="display: none;"></dev-mode-panel>
    <script type="module">
        const item_path = "{item_path}";
        const page_handler = "{handler}";

        await import(window.location.origin + '/sources/client.js');

        WORK.DEV_MODE = {dev_mode};

        /**
         * Ожидание перезапуска сервера в обычный режим:
         * сначала сервер должен упасть (старый процесс выходит),
         * затем подняться (помощник стартует run.mjs).
         */
        async function waitServerRestart() {
            const probe = async () => {
                try {
                    await fetch(window.location.origin, { method: 'HEAD' });
                    return true;
                }
                catch { return false; }
            };
            const until = async (wantUp, tries, delay) => {
                for (let i = 0; i < tries; i++) {
                    if (await probe() === wantUp)
                        return true;
                    await new Promise(r => setTimeout(r, delay));
                }
                return false;
            };
            await until(false, 150, 200);
            if (!await until(true, 600, 500))
                throw new Error('Сервер не поднялся — проверьте work-restart.log и обновите страницу вручную');
        }

        try{
            await WORK.login();
        }
        catch(e){
            console.log(e.message)
        }

        // if (!(location.hash?.length > 2) && item_path === '/' && !WORK.uid && !['site'].includes(page_handler)) {
        //     const base = item_path.replace(/\/$/, '');
        //     location.replace(location.origin + base + '/~/handlers//site/index.html');
        // } else {
            const $item = await WORK.get_item(item_path, 'info');
            window.$context ??= $item;

            const id = $item.id;
            let handler = page_handler;
            const component_name = "{handler-type}-" + handler.toLowerCase();
            handler = await WORK.get_item($item.short + '/~/handlers//' + handler);
            let module = await handler.importView(component_name);
            const el = document.createElement(module.is);
            let view = '{view_name}';
            if(view) {
                el.default_view = view;
                el.view_name = view;
            }
            el.$item = $item;
            document.body.appendChild(el);

            el.$handler = handler;

            window.addEventListener('pointerdown', e=>{
                let parent = window.parent;
                if(window !== parent){
                    for(let p of parent.document.querySelectorAll('[popover]'))
                        p.hidePopover();
                }
                else{
                    for(let w of Array.from(window.frames)){
                        for(let p of w.document.querySelectorAll('[popover]'))
                            p.hidePopover();
                    }
                }
            });
            if(window.top === window){
                const devPanel = document.getElementById('devModePanel');
                const rootItem = await WORK.get_item('/');
                devPanel.$item = rootItem;
                if (WORK.DEV_MODE)
                    devPanel.style.display = '';
                await devPanel.refreshLicenseStatus?.();
            }
        // }
        ODA({
            is: 'dev-mode-panel',
            template: `
            <style>
                :host{
                    background: #d32f2f;
                    color: #ffffff;
                    @apply --horizontal;
                    @apply --center;
                    flex-wrap: wrap;
                    width: 100%;
                    padding: 4px 12px;
                    gap: 10px;
                    box-sizing: border-box;

                    div{
                        text-align: center;
                        font-weight: 600;
                        font-size: 13px;
                        color: #ffffff;
                    }

                    .sep {
                        opacity: 0.6;
                        color: #ffffff;
                        font-weight: 700;
                    }

                    oda-button{
                        background: #ffffff !important;
                        color: #1e293b !important;
                        fill: #1e293b !important;
                        border-radius: 5px;
                        font-weight: 600;
                        font-size: 12.5px;
                    }
                }
            </style>
            <div ~if="showDevMode">СЕРВЕР РАБОТАЕТ В РЕЖИМЕ ОТЛАДКИ</div>
            <oda-button ~if="showDevMode && showRebootButton" :disabled="disableButton" raised icon="carbon:reset" :label="buttonText" @click="reboot"></oda-button>
            <span class="sep" ~if="showDevMode && showUnlicensed">·</span>
            <div ~if="showUnlicensed">ЛИЦЕНЗИЯ НЕ УСТАНОВЛЕНА (ИИ-агенты отключены)</div>
            <oda-button ~if="showUnlicensed" raised icon="carbon:certificate" label="Установить лицензию" @click="openLicenseView"></oda-button>
            <oda-button ~if="showUnlicensed" raised icon="carbon:launch" :label="portalButtonLabel" @click="openPortal"></oda-button>
            `,
            $item: null,
            disableButton: false,
            rebooting: false,
            showDevMode: false,
            showUnlicensed: false,
            portalUrl: 'https://work.odant.org',
            get portalButtonLabel() {
                const raw = String(this.portalUrl || 'https://work.odant.org').replace(/^https?:\/\//i, '').replace(/\/+$/, '');
                return `Личный кабинет (${raw})`;
            },
            attached() {
                if (window.top !== window) {
                    this.style.display = 'none';
                    return;
                }
                this.showDevMode = Boolean(WORK.DEV_MODE);
                this._syncVisibility();
                this.refreshLicenseStatus();
                this._onLicChanged = (e) => {
                    const st = e?.detail;
                    if (st && typeof st.baseLicensed === 'boolean') {
                        this.showUnlicensed = !st.baseLicensed;
                        this.portalUrl = st.tokenBinding?.hubUrl || st.hubUrl || 'https://work.odant.org';
                        this._syncVisibility();
                    }
                    else {
                        this.refreshLicenseStatus();
                    }
                };
                window.addEventListener('work:license-changed', this._onLicChanged);
            },
            detached() {
                if (this._onLicChanged)
                    window.removeEventListener('work:license-changed', this._onLicChanged);
            },
            _syncVisibility() {
                this.style.display = (this.showDevMode || this.showUnlicensed) ? '' : 'none';
            },
            async refreshLicenseStatus() {
                if (window.top !== window)
                    return;
                this.showDevMode = Boolean(WORK.DEV_MODE);
                try {
                    const root = this.$item || await WORK.get_item('/');
                    this.$item = root;
                    const st = await root?.fetch?.('license_status');
                    this.showUnlicensed = Boolean(st && st.baseLicensed === false);
                    this.portalUrl = st?.tokenBinding?.hubUrl || st?.hubUrl || 'https://work.odant.org';
                }
                catch {
                    this.showUnlicensed = false;
                }
                this._syncVisibility();
            },
            async openLicenseView() {
                const root = this.$item || await WORK.get_item('/');
                if (typeof window.top?.execute === 'function') {
                    await window.top.execute(root, { view: 'license' });
                }
                else {
                    window.top.location.hash = '#/~/handlers/pages/form';
                }
            },
            openPortal() {
                window.open(this.portalUrl || 'https://work.odant.org', '_blank', 'noopener');
            },
            get showRebootButton(){
                // только реальный ADMIN корня; в DEV права не обходятся — роли читаются напрямую
                if (!this.$item) return false;
                return Promise.resolve(this.$item.isAdmin).catch(() => false);
            },
            get buttonText(){
                return this.rebooting ?'перезапуск' : 'переключить в обычный';
            },
            async reboot(e){
                if (this.rebooting || this.disableButton) return;
                this.disableButton = true;
                try{
                    const el = document.createElement('p');
                    el.style = 'margin: 32px;';
                    el.textContent = 'Вы уверены, что хотите перезапустить сервер в обычном режиме?';
                    await await WORK.showDialog(el, {
                        TITLE: { label: 'Подтверждение', icon: 'carbon:warning-alt' },
                        OK: { label: 'Перезапустить', icon: 'carbon:reset' },
                        CANCEL: { label: 'Отмена', icon: 'carbon:close' },
                    });
                    this.rebooting = true;
                    await this.$item.fetch('restart_normal');
                    await waitServerRestart();
                    location.reload();
                }
                catch(err){
                    console.error(err);
                    this.rebooting = false;
                    this.disableButton = false;
                }
            }
        })
    </script>
</body>
</html>
